<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeAtlas</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#d8dee9;--dim:#7c8798;
      --a:#7fd6a0;--b:#7fb8ff;--c:#c9a3f5;--warn:#e8b366;--acc:#5eead4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;
       gap:18px;align-items:baseline;flex-wrap:wrap}
h1{font-size:16px;margin:0;letter-spacing:.5px}
h1 span{color:var(--acc)}
#stats{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--dim);padding:10px 16px;cursor:pointer;
           font:inherit;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:20px;max-width:1100px}
.row{display:flex;gap:8px;margin-bottom:16px}
input,select{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--fg);
             padding:10px 12px;border-radius:6px;font:inherit}
button.go{background:var(--acc);color:#0f1115;border:0;padding:10px 20px;
          border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
button.go:disabled{opacity:.4;cursor:default}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
      padding:14px 16px;margin-bottom:12px}
.meta{color:var(--dim);font-size:12px;margin-bottom:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;
     font-weight:700;margin-right:8px}
.A{background:rgba(127,214,160,.16);color:var(--a)}
.B{background:rgba(127,184,255,.16);color:var(--b)}
.C{background:rgba(201,163,245,.16);color:var(--c)}
.ref{color:var(--dim);font-size:12px}
.warn{color:var(--warn)}
.hop{color:var(--dim);font-size:12px;margin:10px 0 4px}
code{background:#0b0d11;padding:1px 5px;border-radius:3px;color:var(--acc)}
pre{background:#0b0d11;padding:12px;border-radius:6px;overflow:auto;
    max-height:340px;font-size:12px;white-space:pre-wrap}
.empty{color:var(--dim);padding:30px;text-align:center}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;
      font-size:12px;color:var(--dim);margin-right:6px}
label.ck{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px}
.act{display:flex;gap:8px;margin-top:10px}
.act button{border:1px solid var(--line);background:none;color:var(--fg);
            padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit;font-size:12px}
.act button.ok:hover{border-color:var(--a);color:var(--a)}
.act button.no:hover{border-color:#e57373;color:#e57373}
</style></head>
<body>
<header>
  <h1>Code<span>Atlas</span></h1>
  <div id="stats">加载中…</div>
</header>
<nav>
  <button class="on" data-t="ask">问答</button>
  <button data-t="impact">影响分析</button>
  <button data-t="review">审核队列</button>
</nav>
<main>

<section id="ask">
  <div class="row">
    <input id="q" placeholder="提问，例如：cJSON_Delete 做什么 / 解析嵌套对象的流程">
    <button class="go" onclick="doAsk()">检索</button>
  </div>
  <div class="row" style="gap:18px">
    <label class="ck"><input type="checkbox" id="g" checked>图多跳扩展</label>
    <label class="ck"><input type="checkbox" id="v" checked>向量召回</label>
  </div>
  <div id="askOut"></div>
</section>

<section id="impact" hidden>
  <div class="row">
    <input id="sym" placeholder="符号名，例如：cJSON_Delete">
    <select id="depth"><option>1</option><option>2</option>
      <option selected>3</option><option>4</option></select>
    <button class="go" onclick="doImpact()">分析</button>
  </div>
  <div id="impOut"></div>
</section>

<section id="review" hidden>
  <div class="meta">LLM 抽取的经验条目在这里审核。<b>审核通过前，检索中完全不可见。</b></div>
  <div id="revOut"></div>
</section>

</main>
<script>
const $=s=>document.querySelector(s), esc=s=>(s??'').toString()
  .replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['ask','impact','review'].forEach(t=>$('#'+t).hidden=(t!==b.dataset.t));
  if(b.dataset.t==='review') loadReview();
});

fetch('/api/stats').then(r=>r.json()).then(s=>{
  const ratio=s.edges?(s.edges_candidate/s.edges*100).toFixed(1):0;
  $('#stats').innerHTML=
    `${esc(s.repo||'').split('/').pop()} · 节点 ${s.nodes} · 关系 ${s.edges}`+
    ` <span class="warn">(候选 ${s.edges_candidate}, ${ratio}%)</span>`+
    ` · 摘要头均 ${s.head_avg_token}tok · Wiki ${s.wiki_pages}`+
    ` · 待审 ${s.exp_pending} · LLM ${s.llm?'已配置':'未配置'}`;
});

async function doAsk(){
  const q=$('#q').value.trim(); if(!q) return;
  $('#askOut').innerHTML='<div class="empty">检索中…</div>';
  const r=await(await fetch('/api/ask',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({q,use_graph:$('#g').checked,use_vector:$('#v').checked})})).json();
  let h=`<div class="meta">模式 ${r.mode} · 召回 符号${r.recall.symbol}/BM25 ${r.recall.bm25}`
       +`/向量${r.recall.vector} → 融合${r.recall.fused} · 图扩展摘要头 ${r.recall.graph_heads}`
       +` · 上下文 ${r.context_tokens} token · A/B级证据 ${r.ab_evidence}</div>`;
  if(r.refused){
    h+=`<div class="card warn">${esc(r.answer).replace(/\n/g,'<br>')}</div>`;
  }else{
    h+=r.answer
      ? `<div class="card">${esc(r.answer).replace(/\n/g,'<br>')}</div>`
      : `<div class="card meta">未配置 LLM，以下为带引用的证据包（配置 LLM_API_KEY 后生成自然语言回答）</div>`;
    h+='<div class="card"><b>证据引用</b><br><br>'+r.citations.map(c=>
        `<div style="margin-bottom:7px"><span class="tag ${c.level}">${c.tag}</span>`
        +`${esc(c.title)} <span class="ref">${esc(c.source_ref||'')}</span></div>`).join('')
      +'</div>';
  }
  $('#askOut').innerHTML=h;
}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doAsk()});

async function doImpact(){
  const s=$('#sym').value.trim(); if(!s) return;
  $('#impOut').innerHTML='<div class="empty">分析中…</div>';
  const res=await fetch(`/api/impact?symbol=${encodeURIComponent(s)}&depth=${$('#depth').value}`);
  if(!res.ok){ $('#impOut').innerHTML='<div class="card warn">未找到该符号</div>'; return; }
  const r=await res.json();
  let h=`<div class="card"><b>改动 ${esc(r.symbol.name)}</b> `
       +`<span class="ref">${esc(r.symbol.path)}:${r.symbol.line_start}</span>`;
  const hops=Object.keys(r.by_hop).sort();
  if(!hops.length) h+='<div class="hop">无确定调用者</div>';
  for(const k of hops){
    h+=`<div class="hop">${k==='1'?'直接调用者':k+' 跳影响'} (${r.by_hop[k].length})</div>`
      +r.by_hop[k].map(x=>`<span class="pill">${esc(x.name)}</span>`).join('');
  }
  h+=`<div class="hop">受影响文件 (${r.affected_files.length}) · `
    +`模块 (${r.affected_modules.length})</div>`
    +r.affected_files.map(f=>`<span class="pill">${esc(f)}</span>`).join('')+'</div>';
  if(r.candidate_impact.length)
    h+=`<div class="card"><b class="warn">⚠ 潜在影响 (${r.candidate_impact.length})</b>`
      +`<div class="meta">函数指针 / 未解析调用推断，未纳入上方结论，需人工确认</div>`
      +r.candidate_impact.map(c=>
        `<span class="pill">${esc(c.name)} · ${esc(c.reason)}</span>`).join('')+'</div>';
  if(r.regression_hints.length)
    h+='<div class="card"><b>回归建议</b><div class="meta">来自已审核经验</div>'
      +r.regression_hints.map(x=>
        `<div>· ${esc(x.title)}：${esc(x.verification||'')}</div>`).join('')+'</div>';
  $('#impOut').innerHTML=h;
}
$('#sym').addEventListener('keydown',e=>{if(e.key==='Enter')doImpact()});

async function loadReview(){
  const r=await(await fetch('/api/experience/pending')).json();
  if(!r.items.length){ $('#revOut').innerHTML='<div class="empty">队列为空</div>'; return; }
  $('#revOut').innerHTML=r.items.map(x=>{
    const de=JSON.parse(x.dead_ends||'[]');
    return `<div class="card"><b>${esc(x.title)}</b>
      <span class="ref">${esc(x.source_ref||'')}</span>
      <div class="hop">现象</div>${esc(x.symptom)}
      ${x.root_cause?`<div class="hop">根因</div>${esc(x.root_cause)}`:''}
      ${de.length?`<div class="hop">无效尝试</div>`
        +de.map(d=>`· ${esc(d)}`).join('<br>'):''}
      ${x.fix_steps?`<div class="hop">修复</div>${esc(x.fix_steps)}`:''}
      <div class="act">
        <button class="ok" onclick="rev('${x.id}','approve')">通过</button>
        <button class="no" onclick="rev('${x.id}','reject')">拒绝</button>
      </div></div>`}).join('');
}
async function rev(id,action){
  await fetch(`/api/experience/${id}/review`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
  loadReview();
}
</script>
</body></html>
