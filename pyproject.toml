[project]
name = "codeatlas"
version = "0.1.0"
description = "Evidence-grounded code knowledge graph and hybrid retrieval for large C repositories"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["libclang>=16.0", "typer>=0.12", "rich>=13.0", "numpy>=1.24",
                "scikit-learn>=1.3", "pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
vector = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "httpx2>=2.0"]

[project.scripts]
codeatlas = "codeatlas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
codeatlas = ["server/static/*.html", "llm/prompts/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
