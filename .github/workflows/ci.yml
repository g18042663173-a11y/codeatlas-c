name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 19 * * 2"
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance mode
        required: true
        default: full
        type: choice
        options: [fast, full, release]

permissions:
  contents: read

jobs:
  fast-cjson:
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'workflow_dispatch' || inputs.mode == 'fast')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Clang and project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          python -m pip install -e ".[dev]"
      - name: Check offline UI controllers
        run: node --test tests/ui_workspace.test.cjs
      - name: Run offline tests and pinned cJSON acceptance
        env:
          OPENAI_API_KEY: ""
          LLM_API_KEY: ""
        run: codeatlas acceptance-eval --mode fast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-fast-cjson
          path: |
            docs/ACCEPTANCE-CJSON-LWIP.*
            docs/TASK-EVAL-CJSON.*
            docs/WORKFLOW-EVAL-CJSON.*

  full-cjson-lwip:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Clang and project
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang
          python -m pip install -e ".[dev]"
      - name: Check offline UI controllers
        run: node --test tests/ui_workspace.test.cjs
      - name: Run both pinned corpora
        env:
          OPENAI_API_KEY: ""
          LLM_API_KEY: ""
        run: codeatlas acceptance-eval --mode full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-full-cjson-lwip
          path: |
            docs/ACCEPTANCE-CJSON-LWIP.*
            docs/TASK-EVAL-CJSON.*
            docs/TASK-EVAL-LWIP.*
            docs/WORKFLOW-EVAL-CJSON.*
            docs/WORKFLOW-EVAL-LWIP.*

  release-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Verify committed reports and public URLs
        env:
          OPENAI_API_KEY: ""
          LLM_API_KEY: ""
        run: codeatlas acceptance-eval --mode release --use-existing
