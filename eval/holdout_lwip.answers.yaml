  ho-lwip-error-dhcp-start-cleanup:
    expected_points:
      - id: early-errors
        text: "netif 无效/未 up 返回 ERR_ARG；MTU 过小或 dhcp 结构分配失败返回 ERR_MEM，尚未取得共享 PCB。"
        evidence: "src/core/ipv4/dhcp.c:813-832"
      - id: pcb-acquire
        text: "dhcp_inc_pcb_refcount 失败时直接返回 ERR_MEM；若本次新分配 dhcp，它已挂到 netif，源码此处没有调用 release_and_stop。"
