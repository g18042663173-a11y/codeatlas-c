tasks:
  ho-lwip-flow-udp-send-pipeline:
    expected_points:
      - id: connected-destination
        text: "udp_send 要求 PCB/pbuf 非空且 remote_ip 不是 ANY，随后把 PCB 中 remote_ip/remote_port 交给 udp_sendto。"
        evidence: "src/core/udp.c:466-478"
      - id: route
        text: "udp_sendto 先检查 IP 版本，优先使用 pcb->netif_idx 或组播接口配置，否则调用 ip_route；找不到 netif 返回 ERR_RTE。"
        evidence: "src/core/udp.c:519-600"
      - id: source
        text: "udp_sendto_if 按目的地址族从 netif 选择源地址，或验证 PCB 的已绑定本地地址仍属于该 netif，再调用 udp_sendto_if_src。"
        evidence: "src/core/udp.c:623-693"
      - id: transport-to-ip
        text: "最内层必要时自动 bind，增加 UDP 头、写端口/长度与校验和，选择 TTL，最后调用 ip_output_if_src 并返回其错误。"
        evidence: "src/core/udp.c:698-908"
    forbidden_claims:
      - "不得声称 udp_send 在 remote_ip 为 ANY 时会自动选择目的地址。"
      - "不得声称 udp_sendto 总是忽略 pcb->netif_idx 做普通路由查找。"
    evidence_payload:
      source:
        - {path: src/core/udp.c, lines: "466-908", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/udp.c#L466-L908"}
      experiment:
        kind: call_path_matrix
        executed: false
        setup: "已 connect PCB 分别配置固定 netif_idx、无 netif_idx 且可路由、无可用路由。"
        expected: "前两种到达 ip_output_if_src；第三种在 udp_sendto 返回 ERR_RTE。"

  ho-lwip-flow-dns-resolution:
    expected_points:
      - id: synchronous-fast-paths
        text: "入口先校验参数和长度，再尝试 localhost、IP 字面量、首选地址族缓存，以及双栈回退地址族缓存；命中时同步 ERR_OK。"
        evidence: "src/core/dns.c:1569-1631"
      - id: server-gate
        text: "普通 DNS 请求若首个服务器为 ANY 会返回 ERR_VAL；mDNS 条件满足时可绕过这个普通服务器门槛。"
        evidence: "src/core/dns.c:1636-1650"
      - id: enqueue
        text: "未命中快路径时 dns_enqueue 选空闲或最老 DONE 表项，写入 NEW 状态、名称、回调和地址类型，然后直接调用 dns_check_entry。"
        evidence: "src/core/dns.c:1438-1525"
      - id: state-machine
        text: "dns_check_entry 把 NEW 转为 ASKING、生成 txid、初始化 server/retry/timer 并发送；ASKING 超时后增长等待、切换备份服务器或回调失败并释放表项。"
        evidence: "src/core/dns.c:1065-1128"
    forbidden_claims:
      - "不得声称每次调用都会发网络查询；字面量和缓存命中是同步快路径。"
      - "不得声称 ERR_INPROGRESS 表示查询已经完成。"
    evidence_payload:
      source:
        - {path: src/core/dns.c, lines: "617-651,1065-1137,1393-1655", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/dns.c#L1393-L1655"}
      experiment:
        kind: state_transition_probe
        executed: false
        setup: "分别查询 IP 字面量、缓存名和未缓存名，并推进 DNS 定时器直到重试上限。"
        expected: "前两者同步 ERR_OK；未缓存名 ERR_INPROGRESS 且 NEW->ASKING，最终切服或回调 NULL 后 UNUSED。"

  ho-lwip-flow-ethernet-demux:
    expected_points:
      - id: header-validation
        text: "基础以太网头长度不足直接计错并释放；VLAN 模式还校验 VLAN 头长度和可选 VLAN hook/check。"
        evidence: "src/netif/ethernet.c:80-136"
      - id: metadata
        text: "入口填充缺失的 if_idx，并按目的 MAC 标记 PBUF_FLAG_LLMCAST 或 PBUF_FLAG_LLBCAST。"
        evidence: "src/netif/ethernet.c:138-168"
      - id: dispatch
        text: "IPv4/ARP 需 NETIF_FLAG_ETHARP，去掉二层头后分别交给 ip4_input/etharp_input；IPv6 去头后交给 ip6_input；PPP 类型交给对应 PPPoE 入口。"
        evidence: "src/netif/ethernet.c:170-232"
      - id: unknown-and-ownership
        text: "未知 EtherType 先给可选 hook；未被接受则计 unknown/drop 并释放。所有返回 ERR_OK 的分支都表示 pbuf 已被消费或释放。"
        evidence: "src/netif/ethernet.c:234-252"
    forbidden_claims:
      - "不得声称 unknown protocol 一定立即释放；hook 返回 ERR_OK 时由 hook 消费。"
      - "不得声称调用者在 ERR_OK 后仍应无条件 pbuf_free。"
    evidence_payload:
      source:
        - {path: src/netif/ethernet.c, lines: "80-253", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/netif/ethernet.c#L80-L253"}
      experiment:
        kind: frame_matrix
        executed: false
        setup: "输入短帧、被 VLAN hook 拒绝帧、IPv4 帧、未知 EtherType 且 hook 接受/拒绝。"
        expected: "短帧和拒绝帧被释放；IPv4 去头后下交；未知帧仅在 hook 不接受时由入口释放。"

  ho-lwip-flow-dhcp-start-discover:
    expected_points:
      - id: client-and-pcb
        text: "dhcp_start 要求 netif 非空且已 up、MTU 足够；必要时分配/挂接 dhcp，清零时保留 EXTERNAL_MEM 标志，再取得共享 DHCP PCB 引用。"
        evidence: "src/core/ipv4/dhcp.c:806-867"
      - id: link-gate
        text: "link 未 up 时仅把状态设为 INIT 并返回 ERR_OK，等待 dhcp_network_changed；link 已 up 才调用 dhcp_discover。"
        evidence: "src/core/ipv4/dhcp.c:868-881"
      - id: discover-message
        text: "discover 清 offered_ip、切 SELECTING，调用 dhcp_create_msg 分配并填公共 DHCP 头和 xid，再追加最大报文、主机名/参数请求等选项。"
        evidence: "src/core/ipv4/dhcp.c:1019-1057,1883-1961"
      - id: send-and-backoff
        text: "构造成功后通过 udp_sendto_if_src 向广播服务器端口发送并立即 pbuf_free；无论是否构造成功都递增 tries（饱和于 255）并计算 request_timeout。"
        evidence: "src/core/ipv4/dhcp.c:1059-1074"
    forbidden_claims:
      - "不得声称接口 up 等价于 link up；后者决定是否立即 discover。"
      - "不得声称 udp_sendto_if_src 接管 p_out 的调用者引用；discover 随后自行释放。"
    evidence_payload:
      source:
        - {path: src/core/ipv4/dhcp.c, lines: "806-882,1019-1075,1883-1961", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/ipv4/dhcp.c#L806-L882"}
      experiment:
        kind: state_matrix
        executed: false
        setup: "netif 已 up，分别令 link down/up 后调用 dhcp_start。"
        expected: "link down 停在 INIT；link up 进入 SELECTING、尝试发送 DISCOVER 并设置退避。"

  ho-lwip-flow-timeout-dispatch:
    expected_points:
      - id: absolute-registration
        text: "sys_timeout 以 sys_now()+msecs 计算绝对到期时间并交给内部登记器，溢出比较由 TIME_LESS_THAN 语义处理。"
        evidence: "src/core/timeouts.c:289-305"
      - id: ordered-list
        text: "内部登记器从 MEMP_SYS_TIMEOUT 分配节点，按 time 插入 next_timeout 链表；更早者放头部。"
        evidence: "src/core/timeouts.c:185-220"
      - id: dispatch-order
        text: "sys_check_timeouts 只用入口捕获的 now 判定本轮到期项；每项先从链表摘除、保存 handler/arg、释放 timeout 节点，再调用 handler。"
        evidence: "src/core/timeouts.c:354-400"
      - id: sleep-result
        text: "无定时器返回无限睡眠值；头项未到期返回其 time-now；否则循环处理入口时已经到期的项。"
        evidence: "src/core/timeouts.c:361-400"
    forbidden_claims:
      - "不得声称 handler 被调用时其 sys_timeo 节点仍有效。"
      - "不得声称一次调用会以不断刷新 now 的方式处理 handler 新建的立即定时器。"
    evidence_payload:
      source:
        - {path: src/core/timeouts.c, lines: "185-220,289-305,354-401", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/timeouts.c#L354-L401"}
      experiment:
        kind: callback_order_probe
        executed: false
        setup: "登记 t+10、t+5、t+20 三项并在首个 handler 中再登记立即项。"
        expected: "原链按 5/10/20 排序；检查使用入口 now，节点先释放再回调，新项是否本轮执行取决于同一固定 now。"

  ho-lwip-cond-udp-bind-conflict:
    expected_points:
      - id: ephemeral
        text: "port==0 时调用 udp_new_port；没有可用临时端口返回 ERR_USE。"
        evidence: "src/core/udp.c:979-986"
      - id: conflict-shape
        text: "显式端口冲突要求端口相同，且地址同类型并相等/任一为 ANY，或任一地址类型本身为 ANY。"
        evidence: "src/core/udp.c:987-1011"
      - id: reuse
        text: "启用 SO_REUSE 时只有当前 PCB 和冲突 PCB 都设置 SOF_REUSEADDR 才跳过该冲突拒绝；仅一方设置仍检查并可能 ERR_USE。"
        evidence: "src/core/udp.c:990-1012"
      - id: activation
        text: "成功后写 local_ip/local_port，并且仅 PCB 尚未在 active list 时插到表头；rebind 不重复插入。"
        evidence: "src/core/udp.c:957-965,1017-1030"
    forbidden_claims:
      - "不得声称不同具体 IPv4 地址在同端口上一律冲突。"
      - "不得声称任意一方 REUSEADDR 即足以共享端口。"
    evidence_payload:
      source:
        - {path: src/core/udp.c, lines: "931-1031", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/udp.c#L931-L1031"}
      experiment:
        kind: bind_matrix
        executed: false
        setup: "同端口组合具体地址 A/A、A/B、ANY/B，并切换双方 REUSEADDR。"
        expected: "A/A 与 ANY/B 冲突；A/B 可不冲突；只有双方 REUSEADDR 时跳过默认拒绝。"

  ho-lwip-cond-tcp-bind-state:
    expected_points:
      - id: state
        text: "PCB 必须非空且 state==CLOSED，否则分别返回 ERR_ARG 或 ERR_VAL。"
        evidence: "src/core/tcp.c:671-684"
      - id: ephemeral
        text: "port==0 调用 tcp_new_port，取不到端口时返回 ERR_BUF。"
        evidence: "src/core/tcp.c:709-713"
      - id: lists-and-timewait
        text: "默认遍历全部 TCP PCB 列表含 TIME_WAIT；当前 PCB 设置 SOF_REUSEADDR 时缩短到不含 TIME_WAIT 的列表集合。"
        evidence: "src/core/tcp.c:664-695"
      - id: reuse-conflict
        text: "同端口且地址族匹配，并且地址相等或任一 ANY 时冲突；SO_REUSE 编译开启后，只有双方都有 REUSEADDR 才跳过 bind 阶段拒绝。"
        evidence: "src/core/tcp.c:714-737"
    forbidden_claims:
      - "不得声称非 CLOSED PCB 可重复 bind。"
      - "不得把 UDP 的临时端口失败码 ERR_USE 套到 TCP；TCP 此处返回 ERR_BUF。"
    evidence_payload:
      source:
        - {path: src/core/tcp.c, lines: "661-751", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/tcp.c#L661-L751"}
      experiment:
        kind: bind_matrix
        executed: false
        setup: "对 ESTABLISHED/CLOSED PCB、port 0、TIME_WAIT 冲突和单双边 REUSEADDR 分别调用。"
        expected: "状态错误 ERR_VAL；无临时端口 ERR_BUF；TIME_WAIT/复用结果按列表与双方标志决定。"

  ho-lwip-cond-pbuf-header-force:
    expected_points:
      - id: wrapper-force-bit
        text: "pbuf_header 与 pbuf_header_force 都进 pbuf_header_impl，区别只是 force=0/1；正增量再转给 pbuf_add_header_impl。"
        evidence: "src/core/pbuf.c:620-664"
      - id: external-payload
        text: "对非连续外部载荷类型，普通版本正向扩头直接失败；force 版本允许把 payload 指针向前移动，供内部 RX 路径使用。"
        evidence: "src/core/pbuf.c:498-522,656-664"
      - id: remaining-guards
        text: "两版仍拒绝 NULL、增量大于 0xFFFF、tot_len 加法回绕；连续缓冲区还必须保证新 payload 不越过 pbuf 结构后的前界。"
        evidence: "src/core/pbuf.c:484-511"
      - id: remove-guard
        text: "负 header_size_increment 走 pbuf_remove_header，删除量超过 p->len 时失败；force 不绕过这个限制。"
        evidence: "src/core/pbuf.c:586-627"
    forbidden_claims:
      - "不得声称 force 会绕过长度溢出或连续缓冲区前界检查。"
      - "不得声称所有 PBUF_REF 正增量在任意指针位置都安全。"
    evidence_payload:
      source:
        - {path: src/core/pbuf.c, lines: "477-664", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/pbuf.c#L477-L533"}
      experiment:
        kind: boundary_matrix
        executed: false
        setup: "对 PBUF_REF、连续 RAM pbuf 前部空间不足、tot_len 近 65535、负增量超过 len 分别调用普通/force。"
        expected: "force 仅改变 PBUF_REF 正扩头结果，其余安全边界仍失败。"

  ho-lwip-cond-dns-sync-result:
    expected_points:
      - id: argument-errors
        text: "addr==NULL、hostname 为 NULL/空、未初始化 PCB（相关配置下）或去掉末尾点后长度仍达到 DNS_MAX_NAME_LENGTH 都返回 ERR_ARG。"
        evidence: "src/core/dns.c:1577-1595"
      - id: terminal-dot-and-literal
        text: "单个末尾点只从用于比较/入队的 hostnamelen 中扣除；IP 字面量只有与请求地址族允许关系匹配时同步 ERR_OK。"
        evidence: "src/core/dns.c:1588-1614"
      - id: cache
        text: "缓存首选地址族命中同步 ERR_OK；双栈优先模式还会尝试另一地址族缓存。"
        evidence: "src/core/dns.c:1615-1631"
      - id: async-or-no-server
        text: "无普通 DNS server 时返回 ERR_VAL；否则 dns_enqueue 成功返回 ERR_INPROGRESS，容量等错误可返回 ERR_MEM。"
        evidence: "src/core/dns.c:1636-1655,1457-1510"
      - id: mdns-server-bypass
        text: "只有编译启用 LWIP_DNS_SUPPORT_MDNS_QUERIES，且 strstr(hostname, \".local\") 返回的首次匹配地址恰等于按去除可选末尾点后的 hostnamelen 计算出的最后六字符起点时，is_mdns 才为 1，并跳过 dns_servers[0] 为 ANY 的 ERR_VAL 门槛。"
        evidence: "src/core/dns.c:1588-1591,1636-1650"
    forbidden_claims:
      - "不得声称任何可解析 IP 字面量都忽略 dns_addrtype 同步成功。"
      - "不得声称 found 回调在 ERR_OK 快路径上必然被调用。"
      - "不得声称名称只要包含 .local、或未启用 LWIP_DNS_SUPPORT_MDNS_QUERIES，也能绕过普通 DNS server 可用性检查。"
      - "不得把该实现概括为无条件 endswith(\".local\")；它比较的是 strstr 的首次匹配位置与 hostnamelen-6。"
    evidence_payload:
      source:
        - {path: src/core/dns.c, lines: "1569-1655", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/dns.c#L1569-L1655"}
        - {path: src/core/dns.c, lines: "1457-1510", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/dns.c#L1457-L1510"}
        - {path: src/core/dns.c, lines: "1636-1650", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/dns.c#L1636-L1650"}
      experiment:
        kind: return_code_matrix
        executed: false
        setup: "传空名、超长名、IPv6 字面量配 IPv4-only、缓存命中、无服务器未缓存名、正常未缓存名。"
        expected: "依次 ERR_ARG、ERR_ARG、跳过字面量 ERR_OK 并继续缓存/入队路径、ERR_OK、ERR_VAL、ERR_INPROGRESS/ERR_MEM。"

  ho-lwip-cond-ip4-route-selection:
    expected_points:
      - id: direct
        text: "线性扫描只考虑 up、link up 且 IPv4 地址非 ANY 的 netif；掩码直连匹配即返回。"
        evidence: "src/core/ipv4/ip4.c:169-177"
      - id: point-to-point
        text: "没有 NETIF_FLAG_BROADCAST 的接口若目标等于其 gateway，也可被当作点到点路径返回。"
        evidence: "src/core/ipv4/ip4.c:178-182"
      - id: hooks
        text: "直连未命中后按编译配置调用 LWIP_HOOK_IP4_ROUTE_SRC(NULL,dest) 或 LWIP_HOOK_IP4_ROUTE(dest)，hook 返回非空即采用。"
