      experiment:
        kind: allocator_failure_matrix
        executed: false
        setup: "分别让 dhcp mem_malloc、dhcp_inc_pcb_refcount、dhcp_create_msg 的 pbuf_alloc 失败。"
        expected: "前两者 start 返回 ERR_MEM；第三者当前仍从 discover/start 返回 ERR_OK 并安排重试。"

  ho-lwip-error-netbuf-reallocation:
    expected_points:
      - id: old-free
        text: "netbuf_alloc 若 buf->p 非 NULL，先 pbuf_free 旧链，再把新 pbuf_alloc 结果赋给 buf->p。"
        evidence: "src/api/netbuf.c:101-111"
      - id: allocation-failure-state
        text: "新分配失败时 buf->p 已是 NULL 并立即返回；buf->ptr 在失败前未清零，可能仍是指向已释放旧 pbuf 的陈旧指针。"
        evidence: "src/api/netbuf.c:106-116"
      - id: delete-after-failure
        text: "netbuf_delete 只有 buf->p 非 NULL 才 pbuf_free 并同时清 p/ptr；失败后 p==NULL，因此不会二次释放旧 pbuf，随后归还 netbuf 本体。"
        evidence: "src/api/netbuf.c:80-90"
    forbidden_claims:
      - "不得声称分配失败时 buf->ptr 一定被置 NULL。"
      - "不得声称 netbuf_delete 会根据陈旧 ptr 再释放一次。"
    evidence_payload:
      source:
        - {path: src/api/netbuf.c, lines: "80-118", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/api/netbuf.c#L80-L118"}
      experiment:
        kind: allocator_failure_injection
        executed: false
        setup: "buf 初始含 p/ptr，令第二次 pbuf_alloc 返回 NULL，再调用 netbuf_delete。"
        expected: "旧 p 释放一次、buf->p=NULL、ptr 暂时陈旧；delete 不再 free p，只释放 netbuf。"

  ho-lwip-error-ip4-reassembly-cap:
    expected_points:
      - id: malformed
        text: "不支持 IP options（头长不等于 IP_HLEN）或 hlen>总长时跳到统一 nullreturn，计 drop 并 pbuf_free 当前片段。"
