  ho-lwip-state-mem-heap:
    expected_points:
      - id: normalize-size
        text: "size 0 返回 NULL；其余先按 MEM_ALIGNMENT 对齐并至少提升到 MIN_SIZE_ALIGNED，检测超过堆或算术回绕。"
        evidence: "src/core/mem.c:817-843"
      - id: split-or-whole
        text: "从 lfree 起扫描首个足够空闲块；若余量还能容纳 struct mem 加最小数据块就拆分，否则整块标 used。"
        evidence: "src/core/mem.c:854-914"
      - id: lfree-advance
        text: "分配命中 lfree 时向后寻找下一空块更新 lfree，并在解锁后返回对齐的数据区。"
        evidence: "src/core/mem.c:918-951"
      - id: free-guards-and-coalesce
        text: "mem_free 拒绝 NULL以外的错位、越界、已 free 或断链指针；合法释放清 used、必要时下调 lfree，并 plug_holes 合并相邻空块。"
        evidence: "src/core/mem.c:603-673"
    forbidden_claims:
      - "不得声称 mem_malloc 总是把命中空块拆成两块。"
      - "不得声称 double free 会再次加入空闲链。"
    evidence_payload:
      source:
        - {path: src/core/mem.c, lines: "603-673,817-963", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/mem.c#L817-L963"}
      experiment:
        kind: heap_invariant_probe
        executed: false
        setup: "分配可拆分大块与近似整块，释放最低地址块并尝试 double free。"
        expected: "按余量选择拆分/整块；首次 free 下调 lfree 并合洞，重复 free 被拒绝并计 illegal。"

