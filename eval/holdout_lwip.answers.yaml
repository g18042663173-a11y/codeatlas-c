  ho-lwip-error-tcp-alloc-reclaim:
    expected_points:
      - id: initial-allocation
        text: "tcp_alloc 首先从 MEMP_TCP_PCB 分配，只在这次返回 NULL 后进入恢复路径。"
        evidence: "src/core/tcp.c:1844-1851"
      - id: closepend-first
        text: "牺牲 PCB 前先遍历活动 PCB，对 TF_CLOSEPEND 清标志并再尝试发 FIN。"
        evidence: "src/core/tcp.c:1814-1829,1844-1851"
      - id: ordered-retries
        text: "回收顺序是最老 TIME_WAIT→重试分配→最老 LAST_ACK→重试→最老 CLOSING→重试→低于新 PCB 优先级的活动连接→最后一次重试。"
        evidence: "src/core/tcp.c:1851-1882"
      - id: timewait-victim
        text: "TIME_WAIT 路径在 tcp_tw_pcbs 中选最长时间未活动的 PCB，并用 tcp_abort 终止它。"
        evidence: "src/core/tcp.c:1787-1807"
      - id: closing-state-victim
        text: "LAST_ACK/CLOSING 路径在活动链中选指定状态下最久未活动的 PCB，并用 tcp_abandon(...,0) 终止，不发 RST。"
        evidence: "src/core/tcp.c:1755-1781"
      - id: priority-victim
        text: "优先级路径只在活动链中考虑低于新 PCB 优先级的连接，选可用最低优先级中最久未活动者并 tcp_abort；新 prio 为 0 时不牺牲活动连接。"
        evidence: "src/core/tcp.c:1709-1749"
      - id: error-stat-adjustment
        text: "某次重试成功时，嵌套的 MEMP_STATS_DEC 会抵消此前连续分配失败累加的对应错误统计。"
        evidence: "src/core/tcp.c:1871-1890"
      - id: final-result
        text: "只对非 NULL PCB 做清零与字段初始化；所有重试仍失败时，末尾直接返回 NULL。"
        evidence: "src/core/tcp.c:1892-1935"
    forbidden_claims:
      - "不得声称 tcp_alloc 在第一次池分配失败时立即返回 NULL。"
      - "不得声称优先级回收可以杀死与新 PCB 同级或更高优先级的活动连接。"
      - "不得声称 LAST_ACK 或 CLOSING 回收通过发送 RST 终止连接。"
      - "不得声称回收阶梯保证最终分配成功。"
    evidence_payload:
      source:
        - {path: src/core/tcp.c, lines: "1709-1807", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/tcp.c#L1709-L1807"}
        - {path: src/core/tcp.c, lines: "1814-1935", permalink: "https://github.com/lwip-tcpip/lwip/blob/3d896ba0a37ff3ce73270ca5e230707fe47f60e3/src/core/tcp.c#L1814-L1935"}
      experiment:
        kind: tcp_pcb_pool_exhaustion_matrix
        executed: false
        setup: "耗尽 MEMP_TCP_PCB，分别仅提供 TIME_WAIT、LAST_ACK、CLOSING、低优先级活动 PCB 作为可回收对象，以及无可回收对象的情况。"
        expected: "按固定阶梯每回收一类后重试；成功时初始化新 PCB 并校正之前失败统计，全部失败时返回 NULL。"

  ho-lwip-error-dns-enqueue-capacity:
