        text: "取得 PCB 后 dhcp_discover 若返回非 ERR_OK，dhcp_start 才调用 dhcp_release_and_stop 并返回 ERR_MEM。"
        evidence: "src/core/ipv4/dhcp.c:863-880"
      - id: allocation-counterexample
        text: "当前 dhcp_discover 在 dhcp_create_msg 返回 NULL 时只记录日志，仍更新 tries/timeout 并返回初始 ERR_OK；该分配失败不会触发 start 的 release_and_stop 分支。"
        evidence: "src/core/ipv4/dhcp.c:1022-1074"
    forbidden_claims:
