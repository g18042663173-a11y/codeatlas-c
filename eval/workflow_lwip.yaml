cases:
  - id: session-import
    purpose: 校验公开来源、许可证、固定版本和内容哈希去重；原始会话不入检索索引。
  - id: agent-trace
    purpose: 验证概念题遵守 Wiki-first，全部 Agent 只调用白名单只读工具且不超过六次。
  - id: pending-gate
    purpose: 验证显式保存的草稿在审核前不成为 B 级检索证据。
  - id: approval-anchor
    purpose: 验证审核前必须绑定 repository/revision/USR/range/definition hash。
  - id: stale-isolation
    purpose: 验证函数定义变化后卡片 stale 且立即退出 B 级检索。
  - id: no-evidence-refusal
    purpose: 验证证据不足和无关请求均拒答且不生成知识卡草稿。
