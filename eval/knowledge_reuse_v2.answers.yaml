      revision: fb16e5cf358798aabb049655975cde8427101056
      line_start: 2833
      line_end: 2863
      text: "    child = item->child;\n    while (child != NULL)\n    {\n        if(depth >= CJSON_CIRCULAR_LIMIT)\
        \ {\n            goto fail;\n        }\n        newchild = cJSON_Duplicate_rec(child, depth +\
        \ 1, true); /* Duplicate (with recurse) each item in the ->next chain */\n        if (!newchild)\n\
        \        {\n            goto fail;\n        }\n        if (next != NULL)\n        {\n        \
        \    /* If newitem->child already set, then crosswire ->prev and ->next and move on */\n     \
        \       next->next = newchild;\n            newchild->prev = next;\n            next = newchild;\n\
        \        }\n        else\n        {\n            /* Set newitem->child and move to it */\n   \
        \         newitem->child = newchild;\n            next = newchild;\n        }\n        child =\
        \ child->next;\n    }\n    if (newitem && newitem->child)\n    {\n        newitem->child->prev\
        \ = newchild;\n    }\n\n"
      text_sha256: 834b722379767930ffaaf65b8cc43254073d0a4b6103991fb19ca912ce3e6409
      source_span:
