        \"\",\"\\\"\\\\u12\\\"\"};\n    for(unsigned i=0;i<sizeof(invalid)/sizeof(invalid[0]);++i) {\n\
        \        const char *end=NULL;\n        cJSON *value=cJSON_ParseWithLengthOpts(invalid[i],strlen(invalid[i])+1,&end,1);\n\
        \        assert(value==NULL);\n        printf(\"rejected input=%s error_offset=%td\\n\",invalid[i],end-invalid[i]);\n\
