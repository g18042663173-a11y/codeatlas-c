      text: "static const struct pbuf *\npbuf_skip_const(const struct pbuf *in, u16_t in_offset, u16_t\
        \ *out_offset)\n{\n  u16_t offset_left = in_offset;\n  const struct pbuf *q = in;\n\n  /* get\
        \ the correct pbuf */\n  while ((q != NULL) && (q->len <= offset_left)) {\n    offset_left = (u16_t)(offset_left\
        \ - q->len);\n    q = q->next;\n  }\n  if (out_offset != NULL) {\n    *out_offset = offset_left;\n\
        \  }\n  return q;\n}\n"
      text_sha256: 659929972560bc9d146e0138772d41c310e35f511e3a5a0f36859a8b17a2807b
      source_span:
        tag: E3
