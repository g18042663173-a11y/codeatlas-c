      kind: source
      path: corpus/lwip/src/core/ipv4/ip4_addr.c
      file_sha256: b440b85c9e49e60510cfa61d40e24b0e2ad480e23a821a94017e42df09dcf8be
      repository: https://github.com/lwip-tcpip/lwip
      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 144
      line_end: 208
      text: "int\nip4addr_aton(const char *cp, ip4_addr_t *addr)\n{\n  u32_t val;\n  u8_t base;\n  char\
        \ c;\n  u32_t parts[4];\n  u32_t *pp = parts;\n\n  c = *cp;\n  for (;;) {\n    /*\n     * Collect\
        \ number up to ``.''.\n     * Values are specified as for C:\n     * 0x=hex, 0=octal, 1-9=decimal.\n\
        \     */\n    if (!lwip_isdigit(c)) {\n      return 0;\n    }\n    val = 0;\n    base = 10;\n\
        \    if (c == '0') {\n      c = *++cp;\n      if (c == 'x' || c == 'X') {\n        base = 16;\n\
        \        c = *++cp;\n      } else {\n        base = 8;\n      }\n    }\n    for (;;) {\n     \
        \ if (lwip_isdigit(c)) {\n        if((base == 8) && ((u32_t)(c - '0') >= 8))\n          break;\n\
        \        val = (val * base) + (u32_t)(c - '0');\n        c = *++cp;\n      } else if (base ==\
        \ 16 && lwip_isxdigit(c)) {\n        val = (val << 4) | (u32_t)(c + 10 - (lwip_islower(c) ? 'a'\
        \ : 'A'));\n        c = *++cp;\n      } else {\n        break;\n      }\n    }\n    if (c == '.')\
        \ {\n      /*\n       * Internet format:\n       *  a.b.c.d\n       *  a.b.c   (with c treated\
        \ as 16 bits)\n       *  a.b (with b treated as 24 bits)\n       */\n      if (pp >= parts + 3)\
        \ {\n        return 0;\n      }\n      *pp++ = val;\n      c = *++cp;\n    } else {\n      break;\n\
        \    }\n  }\n  /*\n   * Check for trailing characters.\n   */\n  if (c != '\\0' && !lwip_isspace(c))\
        \ {\n    return 0;\n  }\n"
      text_sha256: c0c4bcb156862cc7102eea4346fe3ff7c8e66caa608040f98abcf1182ef375ac
      source_span:
        tag: E1
        start: 0
        end: 1282
    - id: format
      tag: E2
      kind: source
      path: corpus/lwip/src/core/ipv4/ip4_addr.c
      file_sha256: b440b85c9e49e60510cfa61d40e24b0e2ad480e23a821a94017e42df09dcf8be
