      id: view
      tag: E2
      kind: source
      path: corpus/lwip/src/core/pbuf.c
      file_sha256: 2f953eb2bc5b696b2eea156386cc4f99c793859bbf65cee967653bdf3374db61
      repository: https://github.com/lwip-tcpip/lwip
      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 1110
      line_end: 1138
      text: "void *\npbuf_get_contiguous(const struct pbuf *p, void *buffer, size_t bufsize, u16_t len,\
        \ u16_t offset)\n{\n  const struct pbuf *q;\n  u16_t out_offset;\n\n  LWIP_ERROR(\"pbuf_get_contiguous:\
        \ invalid buf\", (p != NULL), return NULL;);\n  LWIP_ERROR(\"pbuf_get_contiguous: invalid bufsize\"\
        , (buffer == NULL) || (bufsize >= len), return NULL;);\n\n  q = pbuf_skip_const(p, offset, &out_offset);\n\
        \  if (q != NULL) {\n    if (q->len >= (out_offset + len)) {\n      /* all data in this pbuf,\
        \ return zero-copy */\n      return (u8_t *)q->payload + out_offset;\n    }\n    if (buffer ==\
        \ NULL) {\n      /* the caller does not want to copy */\n      return NULL;\n    }\n    /* need\
        \ to copy */\n    if (pbuf_copy_partial(q, buffer, len, out_offset) != len) {\n      /* copying\
        \ failed: pbuf is too short */\n      return NULL;\n    }\n    return buffer;\n  }\n  /* pbuf\
        \ is too short (offset does not fit in) */\n  return NULL;\n}\n"
      text_sha256: f3bf684b9c31f1a2228906898bee3f591008dabf1c50f01894f2546d7a50fbed
