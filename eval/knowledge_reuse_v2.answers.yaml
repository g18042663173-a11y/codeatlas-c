      line_start: 1
      line_end: 26
      text: "/* CC0-1.0: shallow/deep copies and reference conversion. */\n#include <assert.h>\n#include\
        \ <stdio.h>\n#include <string.h>\n#include \"cJSON.h\"\nint main(void) {\n    cJSON *source=cJSON_Parse(\"\
        {\\\"nested\\\":{\\\"value\\\":1},\\\"label\\\":\\\"before\\\"}\");\n    cJSON *shallow=cJSON_Duplicate(source,0),\
        \ *deep=cJSON_Duplicate(source,1);\n    assert(source && shallow && deep);\n    assert(shallow->child==NULL\
        \ && cJSON_IsObject(shallow));\n    printf(\"shallow object=1 children=%d\\n\",cJSON_GetArraySize(shallow));\n\
        \    cJSON *original_n=cJSON_GetObjectItemCaseSensitive(cJSON_GetObjectItemCaseSensitive(source,\"\
        nested\"),\"value\");\n    cJSON *copied_n=cJSON_GetObjectItemCaseSensitive(cJSON_GetObjectItemCaseSensitive(deep,\"\
        nested\"),\"value\");\n    assert(original_n!=copied_n && copied_n->valuedouble==1);\n    cJSON_SetNumberValue(original_n,9);\n\
        \    printf(\"deep after_source_mutation source=%.0f copy=%.0f distinct=%d\\n\",original_n->valuedouble,copied_n->valuedouble,original_n!=copied_n);\n\
        \    assert(copied_n->valuedouble==1);\n    char storage[]=\"borrowed\";\n    cJSON *reference=cJSON_CreateStringReference(storage);\n\
        \    cJSON *owned_copy=cJSON_Duplicate(reference,1);\n    assert(reference && owned_copy && !(owned_copy->type\
        \ & cJSON_IsReference));\n    storage[0]='B';assert(strcmp(owned_copy->valuestring,\"borrowed\"\
        )==0);\n    printf(\"reference after_storage_mutation source=%s copy=%s copy_is_reference=%d\\\
        n\",reference->valuestring,owned_copy->valuestring,!!(owned_copy->type & cJSON_IsReference));\n\
        \    cJSON_Delete(source);cJSON_Delete(shallow);cJSON_Delete(deep);cJSON_Delete(reference);cJSON_Delete(owned_copy);\n\
        \    return 0;\n}\n"
