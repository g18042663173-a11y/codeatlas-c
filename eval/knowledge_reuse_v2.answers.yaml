      revision: fb16e5cf358798aabb049655975cde8427101056
      line_start: 2427
      line_end: 2448
      text: "static cJSON_bool replace_item_in_object(cJSON *object, const char *string, cJSON *replacement,\
        \ cJSON_bool case_sensitive)\n{\n    if ((replacement == NULL) || (string == NULL))\n    {\n \
        \       return false;\n    }\n\n    /* replace the name in the replacement */\n    if (!(replacement->type\
        \ & cJSON_StringIsConst) && (replacement->string != NULL))\n    {\n        cJSON_free(replacement->string);\n\
        \    }\n    replacement->string = (char*)cJSON_strdup((const unsigned char*)string, &global_hooks);\n\
        \    if (replacement->string == NULL)\n    {\n        return false;\n    }\n\n    replacement->type\
        \ &= ~cJSON_StringIsConst;\n\n    return cJSON_ReplaceItemViaPointer(object, get_object_item(object,\
        \ string, case_sensitive), replacement);\n}\n"
      text_sha256: 032930feec7142b01914806f72836c302b1776bc75dbaf9379d160d613191865
      source_span:
        tag: E1
        start: 0
        end: 719
    - &id044
      id: links
      tag: E2
      kind: source
      path: corpus/cJSON/cJSON.c
      file_sha256: 607e756460fa0de37d20a7a9181f2de29c97bfb7ce5a0e6c2f548243836cd852
      repository: https://github.com/DaveGamble/cJSON
      revision: fb16e5cf358798aabb049655975cde8427101056
      line_start: 2368
      line_end: 2415
      text: "CJSON_PUBLIC(cJSON_bool) cJSON_ReplaceItemViaPointer(cJSON * const parent, cJSON * const\
        \ item, cJSON * replacement)\n{\n    if ((parent == NULL) || (parent->child == NULL) || (replacement\
        \ == NULL) || (item == NULL))\n    {\n        return false;\n    }\n\n    if (replacement == item)\n\
        \    {\n        return true;\n    }\n\n    replacement->next = item->next;\n    replacement->prev\
        \ = item->prev;\n\n    if (replacement->next != NULL)\n    {\n        replacement->next->prev\
        \ = replacement;\n    }\n    if (parent->child == item)\n    {\n        if (parent->child->prev\
        \ == parent->child)\n        {\n            replacement->prev = replacement;\n        }\n    \
        \    parent->child = replacement;\n    }\n    else\n    {   /*\n         * To find the last item\
        \ in array quickly, we use prev in array.\n         * We can't modify the last item's next pointer\
        \ where this item was the parent's child\n         */\n        if (replacement->prev != NULL)\n\
        \        {\n            replacement->prev->next = replacement;\n        }\n        if (replacement->next\
        \ == NULL)\n        {\n            parent->child->prev = replacement;\n        }\n    }\n\n  \
        \  item->next = NULL;\n    item->prev = NULL;\n    cJSON_Delete(item);\n\n    return true;\n}\n"
      text_sha256: 2fbd8f24b4d7d41b6e4ef83f8c3582c4bc0466cc69fb3fc18f4795df91eef15b
      source_span:
