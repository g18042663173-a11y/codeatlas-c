      path: corpus/lwip/src/core/inet_chksum.c
      file_sha256: fc82b44fc866704a51c0aacd6037b10802b88e8576e1b691917cd2b863878b1b
      repository: https://github.com/lwip-tcpip/lwip
      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 132
      line_end: 173
      text: "u16_t\nlwip_standard_chksum(const void *dataptr, int len)\n{\n  const u8_t *pb = (const u8_t\
        \ *)dataptr;\n  const u16_t *ps;\n  u16_t t = 0;\n  u32_t sum = 0;\n  int odd = ((mem_ptr_t)pb\
        \ & 1);\n\n  /* Get aligned to u16_t */\n  if (odd && len > 0) {\n    ((u8_t *)&t)[1] = *pb++;\n\
        \    len--;\n  }\n\n  /* Add the bulk of the data */\n  ps = (const u16_t *)(const void *)pb;\n\
        \  while (len > 1) {\n    sum += *ps++;\n    len -= 2;\n  }\n\n  /* Consume left-over byte, if\
        \ any */\n  if (len > 0) {\n    ((u8_t *)&t)[0] = *(const u8_t *)ps;\n  }\n\n  /* Add end bytes\
        \ */\n  sum += t;\n\n  /* Fold 32-bit sum to 16 bits\n     calling this twice is probably faster\
        \ than if statements... */\n  sum = FOLD_U32T(sum);\n  sum = FOLD_U32T(sum);\n\n  /* Swap if alignment\
        \ was odd */\n  if (odd) {\n    sum = SWAP_BYTES_IN_WORD(sum);\n  }\n\n  return (u16_t)sum;\n\
        }\n"
