      text: "err_t\npbuf_take_at(struct pbuf *buf, const void *dataptr, u16_t len, u16_t offset)\n{\n\
        \  u16_t target_offset;\n  struct pbuf *q = pbuf_skip(buf, offset, &target_offset);\n\n  /* return\
        \ requested data if pbuf is OK */\n  if ((q != NULL) && (q->tot_len >= target_offset + len)) {\n\
        \    u16_t remaining_len = len;\n    const u8_t *src_ptr = (const u8_t *)dataptr;\n    /* copy\
        \ the part that goes into the first pbuf */\n    u16_t first_copy_len;\n    LWIP_ASSERT(\"check\
        \ pbuf_skip result\", target_offset < q->len);\n    first_copy_len = (u16_t)LWIP_MIN(q->len -\
        \ target_offset, len);\n    MEMCPY(((u8_t *)q->payload) + target_offset, dataptr, first_copy_len);\n\
        \    remaining_len = (u16_t)(remaining_len - first_copy_len);\n    src_ptr += first_copy_len;\n\
        \    if (remaining_len > 0) {\n      return pbuf_take(q->next, src_ptr, remaining_len);\n    }\n\
        \    return ERR_OK;\n  }\n  return ERR_MEM;\n}\n"
      text_sha256: 45c280f94ff13601f3a5d3de5b96ec8eeb92c0567d225a94e49fabcd0df752b8
