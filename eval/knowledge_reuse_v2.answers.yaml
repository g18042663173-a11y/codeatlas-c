        \    result=pbuf_header_force(&p,6);assert(result==0 && p.payload==storage && p.len==11);\n  \
        \  printf(\"REF force_add6 valid_reserved_storage result=%d offset=%td len=%u total=%u\\n\",result,(char\
        \ *)p.payload-storage,p.len,p.tot_len);\n    return 0;\n}\n"
