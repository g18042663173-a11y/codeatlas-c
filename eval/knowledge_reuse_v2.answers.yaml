      line_start: 284
      line_end: 321
      text: "char *\nip4addr_ntoa_r(const ip4_addr_t *addr, char *buf, int buflen)\n{\n  u32_t s_addr;\n\
        \  char inv[3];\n  char *rp;\n  u8_t *ap;\n  u8_t rem;\n  u8_t n;\n  u8_t i;\n  int len = 0;\n\
        \n  s_addr = ip4_addr_get_u32(addr);\n\n  rp = buf;\n  ap = (u8_t *)&s_addr;\n  for (n = 0; n\
        \ < 4; n++) {\n    i = 0;\n    do {\n      rem = *ap % (u8_t)10;\n      *ap /= (u8_t)10;\n   \
        \   inv[i++] = (char)('0' + rem);\n    } while (*ap);\n    while (i--) {\n      if (len++ >= buflen)\
        \ {\n        return NULL;\n      }\n      *rp++ = inv[i];\n    }\n    if (len++ >= buflen) {\n\
        \      return NULL;\n    }\n    *rp++ = '.';\n    ap++;\n  }\n  *--rp = 0;\n  return buf;\n}\n"
      text_sha256: 4ddc5a0deb2eb0529c0d9c85d684dfbb6cc8db871b2cde7a50cab48f891e7a03
      source_span:
        tag: E2
        start: 0
        end: 616
    - &id069
      id: width
      tag: E1
      kind: source
      path: corpus/lwip/src/core/ipv4/ip4_addr.c
      file_sha256: b440b85c9e49e60510cfa61d40e24b0e2ad480e23a821a94017e42df09dcf8be
      repository: https://github.com/lwip-tcpip/lwip
