      id: cat
      tag: E1
      kind: source
      path: corpus/lwip/src/core/pbuf.c
      file_sha256: 2f953eb2bc5b696b2eea156386cc4f99c793859bbf65cee967653bdf3374db61
      repository: https://github.com/lwip-tcpip/lwip
      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 856
      line_end: 880
      text: "void\npbuf_cat(struct pbuf *h, struct pbuf *t)\n{\n  struct pbuf *p;\n\n  LWIP_ERROR(\"(h\
        \ != NULL) && (t != NULL) (programmer violates API)\",\n             ((h != NULL) && (t != NULL)),\
        \ return;);\n  LWIP_ASSERT(\"Creating an infinite loop\", h != t);\n\n  /* proceed to last pbuf\
        \ of chain */\n  for (p = h; p->next != NULL; p = p->next) {\n    /* add total length of second\
        \ chain to all totals of first chain */\n    p->tot_len = (u16_t)(p->tot_len + t->tot_len);\n\
        \  }\n  /* { p is last pbuf of first h chain, p->next == NULL } */\n  LWIP_ASSERT(\"p->tot_len\
        \ == p->len (of last pbuf in chain)\", p->tot_len == p->len);\n  LWIP_ASSERT(\"p->next == NULL\"\
        , p->next == NULL);\n  /* add total length of second chain to last pbuf total of first chain */\n\
        \  p->tot_len = (u16_t)(p->tot_len + t->tot_len);\n  /* chain last pbuf of head (p) with first\
        \ of tail (t) */\n  p->next = t;\n  /* p->next now references t, but the caller will drop its\
        \ reference to t,\n   * so netto there is no change to the reference count of t.\n   */\n}\n"
      text_sha256: 70980f2c2521c9d5299c38297d5ebcf409f3ee6ce35c66182a9b5a20ecbffe91
