      line_start: 2802
      line_end: 2831
      text: "    newitem = cJSON_New_Item(&global_hooks);\n    if (!newitem)\n    {\n        goto fail;\n\
        \    }\n    /* Copy over all vars */\n    newitem->type = item->type & (~cJSON_IsReference);\n\
        \    newitem->valueint = item->valueint;\n    newitem->valuedouble = item->valuedouble;\n    if\
        \ (item->valuestring)\n    {\n        newitem->valuestring = (char*)cJSON_strdup((unsigned char*)item->valuestring,\
        \ &global_hooks);\n        if (!newitem->valuestring)\n        {\n            goto fail;\n   \
        \     }\n    }\n    if (item->string)\n    {\n        newitem->string = (item->type&cJSON_StringIsConst)\
        \ ? item->string : (char*)cJSON_strdup((unsigned char*)item->string, &global_hooks);\n       \
        \ if (!newitem->string)\n        {\n            goto fail;\n        }\n    }\n    /* If non-recursive,\
        \ then we're done! */\n    if (!recurse)\n    {\n        return newitem;\n    }\n"
