      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 1060
      line_end: 1091
      text: "u16_t\npbuf_copy_partial(const struct pbuf *buf, void *dataptr, u16_t len, u16_t offset)\n\
        {\n  const struct pbuf *p;\n  u16_t left = 0;\n  u16_t buf_copy_len;\n  u16_t copied_total = 0;\n\
        \n  LWIP_ERROR(\"pbuf_copy_partial: invalid buf\", (buf != NULL), return 0;);\n  LWIP_ERROR(\"\
        pbuf_copy_partial: invalid dataptr\", (dataptr != NULL), return 0;);\n\n  /* Note some systems\
        \ use byte copy if dataptr or one of the pbuf payload pointers are unaligned. */\n  for (p = buf;\
        \ len != 0 && p != NULL; p = p->next) {\n    if ((offset != 0) && (offset >= p->len)) {\n    \
        \  /* don't copy from this buffer -> on to the next */\n      offset = (u16_t)(offset - p->len);\n\
        \    } else {\n      /* copy from this buffer. maybe only partially. */\n      buf_copy_len =\
        \ (u16_t)(p->len - offset);\n      if (buf_copy_len > len) {\n        buf_copy_len = len;\n  \
        \    }\n      /* copy the necessary parts of the buffer */\n      MEMCPY(&((char *)dataptr)[left],\
        \ &((char *)p->payload)[offset], buf_copy_len);\n      copied_total = (u16_t)(copied_total + buf_copy_len);\n\
        \      left = (u16_t)(left + buf_copy_len);\n      len = (u16_t)(len - buf_copy_len);\n      offset\
        \ = 0;\n    }\n  }\n  return copied_total;\n}\n"
      text_sha256: c61174ca191a5dd9b67cc01a2b369ec380f51b805c19320d265e61b58de96b02
      source_span:
