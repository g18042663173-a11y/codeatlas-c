      text: "/* CC0-1.0: owned and reference string mutation. */\n#include <assert.h>\n#include <stdio.h>\n\
        #include <string.h>\n#include \"cJSON.h\"\nint main(void) {\n    cJSON *owned=cJSON_CreateString(\"\
        abcdef\");\n    cJSON *reference=cJSON_CreateStringReference(\"external\");\n    cJSON *number=cJSON_CreateNumber(4);\n\
        \    assert(owned && reference && number);\n    char *original=owned->valuestring;\n    char *result=cJSON_SetValuestring(owned,\"\
        xy\");\n    assert(result==original && strcmp(result,\"xy\")==0);\n    printf(\"owned shorten=xy\
        \ reused_storage=%d\\n\",result==original);\n    result=cJSON_SetValuestring(owned,\"a much longer\
        \ replacement\");\n    assert(result && strcmp(result,\"a much longer replacement\")==0);\n  \
        \  printf(\"owned grow=%s\\n\",result);\n    assert(cJSON_SetValuestring(reference,\"changed\"\
        )==NULL);\n    assert(strcmp(reference->valuestring,\"external\")==0);\n    printf(\"reference\
        \ rejected=1 preserved=%s\\n\",reference->valuestring);\n    assert(cJSON_SetValuestring(number,\"\
        string\")==NULL);\n    printf(\"number rejected=1 value=%.0f\\n\",number->valuedouble);\n    cJSON_Delete(owned);cJSON_Delete(reference);cJSON_Delete(number);\n\
        \    return 0;\n}\n"
