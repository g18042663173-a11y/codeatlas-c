      text: "    if ((input_end - first_sequence) < 6)\n    {\n        /* input ends unexpectedly */\n\
        \        goto fail;\n    }\n\n    /* get the first utf16 sequence */\n    first_code = parse_hex4(first_sequence\
        \ + 2);\n\n    /* check that the code is valid */\n    if (((first_code >= 0xDC00) && (first_code\
        \ <= 0xDFFF)))\n    {\n        goto fail;\n    }\n\n    /* UTF16 surrogate pair */\n    if ((first_code\
        \ >= 0xD800) && (first_code <= 0xDBFF))\n    {\n        const unsigned char *second_sequence =\
        \ first_sequence + 6;\n        unsigned int second_code = 0;\n        sequence_length = 12; /*\
        \ \\uXXXX\\uXXXX */\n\n        if ((input_end - second_sequence) < 6)\n        {\n           \
        \ /* input ends unexpectedly */\n            goto fail;\n        }\n\n        if ((second_sequence[0]\
        \ != '\\\\') || (second_sequence[1] != 'u'))\n        {\n            /* missing second half of\
        \ the surrogate pair */\n            goto fail;\n        }\n\n        /* get the second utf16\
        \ sequence */\n        second_code = parse_hex4(second_sequence + 2);\n        /* check that the\
        \ code is valid */\n        if ((second_code < 0xDC00) || (second_code > 0xDFFF))\n        {\n\
        \            /* invalid second half of the surrogate pair */\n            goto fail;\n       \
        \ }\n\n\n        /* calculate the unicode codepoint from the surrogate pair */\n        codepoint\
        \ = 0x10000 + (((first_code & 0x3FF) << 10) | (second_code & 0x3FF));\n    }\n    else\n    {\n\
        \        sequence_length = 6; /* \\uXXXX */\n        codepoint = first_code;\n    }\n"
