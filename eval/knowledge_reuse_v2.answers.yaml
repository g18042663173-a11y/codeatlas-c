      kind: source
      path: corpus/cJSON/cJSON.c
      file_sha256: 607e756460fa0de37d20a7a9181f2de29c97bfb7ce5a0e6c2f548243836cd852
      repository: https://github.com/DaveGamble/cJSON
      revision: fb16e5cf358798aabb049655975cde8427101056
      line_start: 435
      line_end: 463
      text: "CJSON_PUBLIC(char*) cJSON_SetValuestring(cJSON *object, const char *valuestring)\n{\n   \
        \ char *copy = NULL;\n    size_t v1_len;\n    size_t v2_len;\n    /* if object's type is not cJSON_String\
        \ or is cJSON_IsReference, it should not set valuestring */\n    if ((object == NULL) || !(object->type\
        \ & cJSON_String) || (object->type & cJSON_IsReference))\n    {\n        return NULL;\n    }\n\
        \    /* return NULL if the object is corrupted or valuestring is NULL */\n    if (object->valuestring\
        \ == NULL || valuestring == NULL)\n    {\n        return NULL;\n    }\n\n    v1_len = strlen(valuestring);\n\
        \    v2_len = strlen(object->valuestring);\n\n    if (v1_len <= v2_len)\n    {\n        /* strcpy\
        \ does not handle overlapping string: [X1, X2] [Y1, Y2] => X2 < Y1 or Y2 < X1 */\n        if (!(\
        \ valuestring + v1_len < object->valuestring || object->valuestring + v2_len < valuestring ))\n\
        \        {\n            return NULL;\n        }\n        strcpy(object->valuestring, valuestring);\n\
        \        return object->valuestring;\n    }\n"
      text_sha256: 53a19bb213a8931931fcbbc07fc4b3e7cb74d15b125f5db1441584ffb1fb7d67
      source_span:
