      line_start: 221
      line_end: 258
      text: "    case 2:             /* a.b -- 8.24 bits */\n      if (val > 0xffffffUL) {\n        return\
        \ 0;\n      }\n      if (parts[0] > 0xff) {\n        return 0;\n      }\n      val |= parts[0]\
        \ << 24;\n      break;\n\n    case 3:             /* a.b.c -- 8.8.16 bits */\n      if (val >\
        \ 0xffff) {\n        return 0;\n      }\n      if ((parts[0] > 0xff) || (parts[1] > 0xff)) {\n\
        \        return 0;\n      }\n      val |= (parts[0] << 24) | (parts[1] << 16);\n      break;\n\
        \n    case 4:             /* a.b.c.d -- 8.8.8.8 bits */\n      if (val > 0xff) {\n        return\
        \ 0;\n      }\n      if ((parts[0] > 0xff) || (parts[1] > 0xff) || (parts[2] > 0xff)) {\n    \
        \    return 0;\n      }\n      val |= (parts[0] << 24) | (parts[1] << 16) | (parts[2] << 8);\n\
        \      break;\n    default:\n      LWIP_ASSERT(\"unhandled\", 0);\n      break;\n  }\n  if (addr)\
        \ {\n    ip4_addr_set_u32(addr, lwip_htonl(val));\n  }\n  return 1;\n}\n"
      text_sha256: 0df27fbf66134063fea10c6de4e72394628ab9afa3a6a6da5c64a9a10a6df7fc
