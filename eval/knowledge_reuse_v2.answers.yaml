      text: "u16_t\ninet_chksum_pbuf(struct pbuf *p)\n{\n  u32_t acc;\n  struct pbuf *q;\n  int swapped\
        \ = 0;\n\n  acc = 0;\n  for (q = p; q != NULL; q = q->next) {\n    acc += LWIP_CHKSUM(q->payload,\
        \ q->len);\n    acc = FOLD_U32T(acc);\n    if (q->len % 2 != 0) {\n      swapped = !swapped;\n\
        \      acc = SWAP_BYTES_IN_WORD(acc);\n    }\n  }\n\n  if (swapped) {\n    acc = SWAP_BYTES_IN_WORD(acc);\n\
        \  }\n  return (u16_t)~(acc & 0xffffUL);\n}\n"
