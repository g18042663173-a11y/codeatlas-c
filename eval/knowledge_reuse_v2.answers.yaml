      line_start: 666
      line_end: 699
      text: "static unsigned parse_hex4(const unsigned char * const input)\n{\n    unsigned int h = 0;\n\
        \    size_t i = 0;\n\n    for (i = 0; i < 4; i++)\n    {\n        /* parse digit */\n        if\
        \ ((input[i] >= '0') && (input[i] <= '9'))\n        {\n            h += (unsigned int) input[i]\
        \ - '0';\n        }\n        else if ((input[i] >= 'A') && (input[i] <= 'F'))\n        {\n   \
        \         h += (unsigned int) 10 + input[i] - 'A';\n        }\n        else if ((input[i] >= 'a')\
        \ && (input[i] <= 'f'))\n        {\n            h += (unsigned int) 10 + input[i] - 'a';\n   \
        \     }\n        else /* invalid */\n        {\n            return 0;\n        }\n\n        if\
        \ (i < 3)\n        {\n            /* shift left to make place for the next nibble */\n       \
        \     h = h << 4;\n        }\n    }\n\n    return h;\n}\n"
      text_sha256: 2660de3d076135968260292b19892adde4e67e5f11d9b24db7cd0641de4e469b
