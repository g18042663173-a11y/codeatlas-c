      text: "static u8_t\npbuf_add_header_impl(struct pbuf *p, size_t header_size_increment, u8_t force)\n\
        {\n  u16_t type_internal;\n  void *payload;\n  u16_t increment_magnitude;\n\n  LWIP_ASSERT(\"\
        p != NULL\", p != NULL);\n  if ((p == NULL) || (header_size_increment > 0xFFFF)) {\n    return\
        \ 1;\n  }\n  if (header_size_increment == 0) {\n    return 0;\n  }\n\n  increment_magnitude =\
        \ (u16_t)header_size_increment;\n  /* Do not allow tot_len to wrap as a result. */\n  if ((u16_t)(increment_magnitude\
        \ + p->tot_len) < increment_magnitude) {\n    return 1;\n  }\n\n  type_internal = p->type_internal;\n\
        \n  /* pbuf types containing payloads? */\n  if (type_internal & PBUF_TYPE_FLAG_STRUCT_DATA_CONTIGUOUS)\
        \ {\n    /* set new payload pointer */\n    payload = (u8_t *)p->payload - header_size_increment;\n\
        \    /* boundary check fails? */\n    if ((u8_t *)payload < (u8_t *)p + SIZEOF_STRUCT_PBUF) {\n\
        \      LWIP_DEBUGF( PBUF_DEBUG | LWIP_DBG_TRACE,\n                   (\"pbuf_add_header: failed\
        \ as %p < %p (not enough space for new header size)\\n\",\n                    (void *)payload,\
        \ (void *)((u8_t *)p + SIZEOF_STRUCT_PBUF)));\n      /* bail out unsuccessfully */\n      return\
        \ 1;\n    }\n    /* pbuf types referring to external payloads? */\n  } else {\n    /* hide a header\
        \ in the payload? */\n    if (force) {\n      payload = (u8_t *)p->payload - header_size_increment;\n\
        \    } else {\n      /* cannot expand payload to front (yet!)\n       * bail out unsuccessfully\
        \ */\n      return 1;\n    }\n  }\n  LWIP_DEBUGF(PBUF_DEBUG | LWIP_DBG_TRACE, (\"pbuf_add_header:\
        \ old %p new %p (%\"U16_F\")\\n\",\n              (void *)p->payload, (void *)payload, increment_magnitude));\n\
        \n  /* modify pbuf fields */\n  p->payload = payload;\n  p->len = (u16_t)(p->len + increment_magnitude);\n\
        \  p->tot_len = (u16_t)(p->tot_len + increment_magnitude);\n\n\n  return 0;\n}\n"
      text_sha256: 1f47b127e7d37641e75b4d7d76d7eec50fe4efc9ce9d1aab2cbde58a32eefd47
