      id: take
      tag: E2
      kind: source
      path: corpus/lwip/src/core/pbuf.c
      file_sha256: 2f953eb2bc5b696b2eea156386cc4f99c793859bbf65cee967653bdf3374db61
      repository: https://github.com/lwip-tcpip/lwip
      revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
      line_start: 1235
      line_end: 1266
      text: "err_t\npbuf_take(struct pbuf *buf, const void *dataptr, u16_t len)\n{\n  struct pbuf *p;\n\
        \  size_t buf_copy_len;\n  size_t total_copy_len = len;\n  size_t copied_total = 0;\n\n  LWIP_ERROR(\"\
        pbuf_take: invalid buf\", (buf != NULL), return ERR_ARG;);\n  LWIP_ERROR(\"pbuf_take: invalid\
        \ dataptr\", (dataptr != NULL), return ERR_ARG;);\n  LWIP_ERROR(\"pbuf_take: buf not large enough\"\
        , (buf->tot_len >= len), return ERR_MEM;);\n\n  if ((buf == NULL) || (dataptr == NULL) || (buf->tot_len\
        \ < len)) {\n    return ERR_ARG;\n  }\n\n  /* Note some systems use byte copy if dataptr or one\
        \ of the pbuf payload pointers are unaligned. */\n  for (p = buf; total_copy_len != 0; p = p->next)\
        \ {\n    LWIP_ASSERT(\"pbuf_take: invalid pbuf\", p != NULL);\n    buf_copy_len = total_copy_len;\n\
        \    if (buf_copy_len > p->len) {\n      /* this pbuf cannot hold all remaining data */\n    \
        \  buf_copy_len = p->len;\n    }\n    /* copy the necessary parts of the buffer */\n    MEMCPY(p->payload,\
        \ &((const char *)dataptr)[copied_total], buf_copy_len);\n    total_copy_len -= buf_copy_len;\n\
        \    copied_total += buf_copy_len;\n  }\n  LWIP_ASSERT(\"did not copy all data\", total_copy_len\
        \ == 0 && copied_total == len);\n  return ERR_OK;\n}\n"
      text_sha256: 20b2d21c0a3a70dba8c95f686a49ac9a5eb40caff65d003a933bb4db9e343059
