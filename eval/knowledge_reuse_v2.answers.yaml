      line_end: 618
      text: "u8_t\npbuf_remove_header(struct pbuf *p, size_t header_size_decrement)\n{\n  void *payload;\n\
        \  u16_t increment_magnitude;\n\n  LWIP_ASSERT(\"p != NULL\", p != NULL);\n  if ((p == NULL) ||\
        \ (header_size_decrement > 0xFFFF)) {\n    return 1;\n  }\n  if (header_size_decrement == 0) {\n\
        \    return 0;\n  }\n\n  increment_magnitude = (u16_t)header_size_decrement;\n  /* Check that\
        \ we aren't going to move off the end of the pbuf */\n  LWIP_ERROR(\"increment_magnitude <= p->len\"\
        , (increment_magnitude <= p->len), return 1;);\n\n  /* remember current payload pointer */\n \
        \ payload = p->payload;\n  LWIP_UNUSED_ARG(payload); /* only used in LWIP_DEBUGF below */\n\n\
        \  /* increase payload pointer (guarded by length check above) */\n  p->payload = (u8_t *)p->payload\
        \ + header_size_decrement;\n  /* modify pbuf length fields */\n  p->len = (u16_t)(p->len - increment_magnitude);\n\
        \  p->tot_len = (u16_t)(p->tot_len - increment_magnitude);\n\n  LWIP_DEBUGF(PBUF_DEBUG | LWIP_DBG_TRACE,\
        \ (\"pbuf_remove_header: old %p new %p (%\"U16_F\")\\n\",\n              (void *)payload, (void\
        \ *)p->payload, increment_magnitude));\n\n  return 0;\n}\n"
