      line_start: 899
      line_end: 906
      text: "void\npbuf_chain(struct pbuf *h, struct pbuf *t)\n{\n  pbuf_cat(h, t);\n  /* t is now referenced\
        \ by h */\n  pbuf_ref(t);\n  LWIP_DEBUGF(PBUF_DEBUG | LWIP_DBG_TRACE, (\"pbuf_chain: %p references\
        \ %p\\n\", (void *)h, (void *)t));\n}\n"
