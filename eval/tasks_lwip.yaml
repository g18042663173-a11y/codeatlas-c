    expected_anchors:
      - symbol: netif_add
        path: src/core/netif.c
        line_start: 286
    rationale: 固定快照中的公开网络接口添加入口，定义位置唯一。

  - id: locate-tcp-input
    type: 定位
    status: approved
    question: TCP 收包主入口 tcp_input 在哪里实现？
