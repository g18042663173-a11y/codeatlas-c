        path: src/core/netif.c
        line_start: 249
      - symbol: ppp_new
        path: src/netif/ppp/ppp.c
        line_start: 649
    rationale: 三个调用者均由 compile database 下的 certain AST 调用边确认。

  - id: callers-tcp-input
