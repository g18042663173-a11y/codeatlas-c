      path: src/core/netif.c
      line_start: 286
    depth: 2
    expected_certain:
      - symbol: netif_init
        path: src/core/netif.c
        line_start: 187
      - symbol: netif_add_noaddr
        path: src/core/netif.c
        line_start: 249
