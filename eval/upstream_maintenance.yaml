          operator: contains
          expected: "version=maintenance-version\n"
          description: The unrelated version mechanism demonstrably changed.
        - id: guard_parser_unchanged
          stream: stdout
          operator: contains
          expected: "simple_array=pass\n"
          description: The parser-card behavior remains unchanged.
    artifacts:
      patch: {path: examples/maintenance_upstream/cjson/unrelated/change.patch, sha256: dc78ad6b0f4a292bd3f20c9cc5f95d860c683e59c20088c617cd93426750568c}
