    material_kind: upstream_mutation
    execution_status: ready
    failure_mode: null
    claim: cJSON's parser enforces its nesting limit through parse_value's lower-level array/object dispatch and reports the failing input position.
    mutation: Replace only the public version string outside the parser-card mechanism.
    oracle:
      source_kind: pinned_public_source_and_experiment
      derived_from_codeatlas: false
      expected_decision: keep
      expected_outcome: completed
      assertions:
        - id: target_version_string
