schema_version: 1
evaluation: upstream_maintenance

corpora:
  cjson:
    repository: corpus/cJSON
    revision: fb16e5cf358798aabb049655975cde8427101056
    claim_anchor:
      path: cJSON.c
      start_marker: "static cJSON_bool parse_value(cJSON * const item, parse_buffer * const input_buffer);"
      end_marker: "\n/* Render an object to text. */"
    claim_dependencies:
      functions:
        - {path: cJSON.c, name: parse_value}
        - {path: cJSON.c, name: parse_array}
        - {path: cJSON.c, name: parse_object}
        - {path: cJSON.c, name: cJSON_ParseWithOpts}
        - {path: cJSON.c, name: cJSON_ParseWithLengthOpts}
      macros:
        - name: CJSON_NESTING_LIMIT
          paths: [cJSON.h, cJSON.c]
    build:
      compile_steps:
        - [cc, -std=c99, -Wall, -Wextra, -Werror, -I, "{source}", "{source}/cJSON.c", "{harness}", -lm, -o, "{build}/probe"]
      run_argv: ["{build}/probe"]
  lwip:
    repository: corpus/lwip
    revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
    claim_anchor:
      path: src/core/netif.c
      start_marker: "struct netif *\nnetif_add("
      end_marker: "\nstatic void\nnetif_do_ip_addr_changed"
    claim_dependencies:
      functions:
        - {path: src/core/netif.c, name: netif_add}
        - {path: src/core/netif.c, name: netif_set_default}
      macros:
        - name: LWIP_SINGLE_NETIF
          paths: [src/include/lwip/opt.h]
    build:
      compile_steps:
        - [cc, -std=c99, -Wall, -Wextra, -ffunction-sections, -fdata-sections, -I, "{fixture_root}", -I, "{source}/test/unit/arch", -I, "{source}/contrib/ports/unix/port/include", -I, "{source}/src/include", -c, "{source}/src/core/netif.c", -o, "{build}/netif.o"]
        - [cc, -std=c99, -Wall, -Wextra, -ffunction-sections, -fdata-sections, -I, "{fixture_root}", -I, "{source}/test/unit/arch", -I, "{source}/contrib/ports/unix/port/include", -I, "{source}/src/include", -c, "{source}/src/core/ipv4/ip4_addr.c", -o, "{build}/ip4_addr.o"]
        - [cc, -std=c99, -Wall, -Wextra, -ffunction-sections, -fdata-sections, -I, "{fixture_root}", -I, "{source}/test/unit/arch", -I, "{source}/contrib/ports/unix/port/include", -I, "{source}/src/include", -c, "{harness}", -o, "{build}/probe.o"]
        - [cc, "-Wl,-dead_strip", "{build}/netif.o", "{build}/ip4_addr.o", "{build}/probe.o", -o, "{build}/probe"]
      run_argv: ["{build}/probe"]

cases:
  - id: upstream-cjson-effective-depth-condition
    corpus: cjson
    classification: effective
    material_kind: upstream_mutation
    execution_status: ready
    failure_mode: null
    claim: parse_array and parse_object reject a container when current depth is greater than or equal to CJSON_NESTING_LIMIT.
    mutation: Change both depth guards from greater-than-or-equal to strict greater-than.
    oracle:
      source_kind: pinned_public_source_and_experiment
      derived_from_codeatlas: false
      expected_decision: revalidate
      expected_outcome: completed
      assertions:
        - id: target_limit_plus_one_allowed
          stream: stdout
          operator: contains
          expected: "nested_limit_plus_one=pass\n"
          description: The changed guard admits exactly one additional nesting level.
        - id: target_limit_plus_two_rejected
          stream: stdout
          operator: contains
          expected: "nested_limit_plus_two=fail\n"
          description: The next nesting level is still rejected, separating the predicate change.
    artifacts:
      patch: {path: examples/maintenance_upstream/cjson/effective/change.patch, sha256: 89924be5c85efb7fd3efb8e152d495de4dce82224b9dc128cd6bd081902a60c9}
      harness: &cjson_harness {path: examples/maintenance_upstream/cjson/probe.c, sha256: 0d6011a7ab6b64277e629481962a05934fc20741923747a7013380223da4c26d}
      support: []
    publication: &cjson_publication
      card_id: cjson-nesting-parse-value-card
      citation_path: cJSON.c
      wiki_page: cjson-nesting-parse-value

  - id: upstream-cjson-effective-nesting-config
    corpus: cjson
    classification: effective
    material_kind: upstream_mutation
    execution_status: ready
    failure_mode: null
    claim: CJSON_NESTING_LIMIT is a compile-time configuration consumed by the parser translation unit.
    mutation: Override the translation-unit limit to two immediately after the public header is consumed.
    oracle:
      source_kind: pinned_public_source_and_experiment
      derived_from_codeatlas: false
      expected_decision: revalidate
      expected_outcome: completed
      assertions:
        - id: target_config_depth_two_allowed
          stream: stdout
          operator: contains
          expected: "nested_2=pass\n"
          description: Two nested containers remain within the configured limit.
        - id: target_config_depth_three_rejected
          stream: stdout
          operator: contains
          expected: "nested_3=fail\n"
          description: A third nested container is rejected by the compile-time limit.
    artifacts:
      patch: {path: examples/maintenance_upstream/cjson/null_policy/change.patch, sha256: 4f2d624e3caad985f5fe1903e8e91ab1fdf6c4e54a922a9c32e4560747e72406}
      harness: *cjson_harness
      support: []
    publication: *cjson_publication

  - id: upstream-cjson-effective-parse-value-dispatch
    corpus: cjson
    classification: effective
    material_kind: upstream_mutation
    execution_status: ready
    failure_mode: null
    claim: parse_value delegates an opening bracket to parse_array and propagates the lower-level result while object dispatch remains separate.
    mutation: Invoke parse_array but discard its successful result and reject the array branch at parse_value.
    oracle:
      source_kind: pinned_public_source_and_experiment
      derived_from_codeatlas: false
      expected_decision: revalidate
      expected_outcome: completed
      assertions:
        - id: target_simple_array_rejected
          stream: stdout
          operator: contains
          expected: "simple_array=fail\n"
          description: The mutated array dispatch is observed at the public parser.
        - id: target_object_dispatch_preserved
          stream: stdout
          operator: contains
          expected: "simple_object=pass\n"
          description: The separate object dispatch still reaches parse_object.
    artifacts:
      patch: {path: examples/maintenance_upstream/cjson/child_traversal/change.patch, sha256: 112c2acf26c5eaa698fc37502fc1110ee759fcbe4f666280911f5215f71e9954}
      harness: *cjson_harness
      support: []
    publication: *cjson_publication

  - id: upstream-cjson-effective-failure-position
    corpus: cjson
    classification: effective
    material_kind: upstream_mutation
    execution_status: ready
    failure_mode: null
    claim: On a nested parse failure, cJSON_ParseWithOpts exposes the failing buffer offset through return_parse_end.
    mutation: Force the reported local error position to the start of the input.
    oracle:
      source_kind: pinned_public_source_and_experiment
      derived_from_codeatlas: false
      expected_decision: revalidate
      expected_outcome: completed
      assertions:
        - id: target_failure_offset_reset
          stream: stdout
          operator: contains
          expected: "deep_failure_offset=0\n"
          description: The mutation changes the public failure pointer to input position zero.
        - id: target_deep_input_still_fails
          stream: stdout
          operator: contains
          expected: "nested_limit_plus_two=fail\n"
          description: The mutation changes only failure location, not failure status.
    artifacts:
      patch: {path: examples/maintenance_upstream/cjson/overflow_boundary/change.patch, sha256: 3b8400f2f157e57083b0b975c43cc96e460746b7d534891853f0146c116ea9ef}
      harness: *cjson_harness
      support: []
    publication: *cjson_publication

