schema_version: 1
name: CodeAtlas 三类价值证明清单
judge_qualification:
  policy: eval/judge_qualification_v4.yaml
  report: docs/JUDGE-QUALIFICATION-V4.json
experiments:
  - id: wiki-cjson
    kind: wiki_knowledge
    corpus: cjson
    manifest: eval/holdout_cjson.yaml
    answer_key: eval/holdout_cjson.answers.yaml
    report: docs/runs/curated/PROOF-WIKI-CJSON-V5.json
    historical_review_validity: docs/WIKI-CJSON-EVIDENCE-AUDIT.json
    required_for_effect: true
  - id: wiki-lwip
    kind: wiki_knowledge
    corpus: lwip
    manifest: eval/holdout_lwip.yaml
    answer_key: eval/holdout_lwip.answers.yaml
    report: docs/runs/curated/PROOF-WIKI-LWIP-V4.json
    review_validity: docs/WIKI-LWIP-EVIDENCE-AUDIT.json
    required_for_effect: true
  - id: knowledge-reuse
    kind: knowledge_reuse
    corpus: combined
    manifest: eval/knowledge_reuse.yaml
    answer_key: eval/knowledge_reuse.answers.yaml
    production_mode: model_generated_dual_reviewed
    generated_artifact: eval/frozen/knowledge_reuse-v4.json
    report: docs/runs/curated/PROOF-KNOWLEDGE-REUSE-V4.json
    review_validity: docs/REUSE-EVIDENCE-AUDIT.json
    required_for_effect: true
  - id: maintenance
    kind: maintenance
    corpus: combined
    manifest: eval/upstream_maintenance.yaml
    report: docs/PROOF-MAINTENANCE-UPSTREAM-V5.json
    required_for_effect: true
