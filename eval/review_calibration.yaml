rubric_contract:
  decisions:
    pass: Correct, complete, source-grounded answer with every expected point met.
    partial: No material false claim, but at least one expected point or necessary condition is missed.
    fail: A material claim is contradicted, fabricated, or attempts to manipulate scoring instead of answering.
    acceptable_refusal: The answer correctly preserves an evidence boundary and requests the experiment needed for the unresolved point.
  citation_states:
    - verified
    - mismatched
    - fabricated
    - absent
  point_states:
    met: The candidate correctly and sufficiently covers the expected point.
    missed: The candidate does not cover the expected point but does not assert its opposite.
    contradicted: The candidate asserts a material claim incompatible with the expected point.

