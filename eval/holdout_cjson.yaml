    category: 跨函数流程
    question: "cJSON_Minify 如何在同一缓冲区内删除空白和两类注释、复制字符串内容？minify_string 对相邻的反斜杠+引号做了什么，这是否足以覆盖偶数个连续反斜杠后的引号边界？"
    rationale: "要求串联主扫描器、注释跳过器和字符串复制器，并区分源码的局部二字节检查与完整的反斜杠奇偶转义判断。"
