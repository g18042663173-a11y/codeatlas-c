  kr-v2-cjson-exclude-error-causes:
    expected_points:
      - id: c2-fixed-shape
        text: The current cases are balanced arrays generated as depth opening brackets, one zero, depth closing brackets, and a terminating NUL; the parser is called with require_null_terminated=1.
        kind: condition
        evidence: [c2-generator, c2-call]
      - id: c2-nul-excluded
        text: A missing terminal NUL is excluded for these generated inputs because nested_array writes the NUL and cJSON_ParseWithOpts includes it in buffer_length before enforcing require_null_terminated.
        kind: fact
        evidence: [c2-generator, c2-length-wrapper, c2-null-check]
      - id: c2-brackets-excluded
        text: Mismatched brackets are excluded for these generated inputs because the generator emits equal counts of '[' and ']', and the depth=1000 instance of the same shape parses successfully.
        kind: fact
        evidence: [c2-generator, c2-output]
      - id: c2-limit-supported
        text: "Hitting the nesting limit is supported: the default is 1000, parse_array rejects when current depth is >= that limit before incrementing, and the observed transition is success at 1000 to failure at 1001 with failure offset 1000."
        kind: fact
        evidence: [c2-default-limit, c2-array-guard, c2-output]
      - id: c2-allocation-unresolved
        text: Ordinary internal allocation failure is neither established as the cause nor fully ruled out by the current run because cJSON has independent root/item allocation failure paths and the harness records no allocator event.
        kind: fact
        evidence: [c2-root-allocation, c2-child-allocation, c2-output]
      - id: c2-allocation-test
        text: Distinguishing ordinary allocation failure requires an additional controlled experiment, such as allocator fault injection/telemetry or the limit-shift A/B while holding the input and build otherwise fixed.
        kind: action
        evidence: [c2-root-allocation, c2-child-allocation, c2-output]
      - id: c2-offset-boundary
        text: parse_end=1000 is the recorded buffer.offset on failure and is consistent with the limit guard, but that offset alone is not a universal proof that every NULL result has the same cause.
        kind: fact
        evidence: [c2-failure-position, c2-array-guard, c2-output]
    forbidden_claims:
      - The generated depth=1001 input lacks a terminating NUL.
      - The generated depth=1001 input has unbalanced brackets.
      - One successful reproduction definitively excludes every internal allocation failure.
      - parse_end=1000 proves that every possible NULL result is caused by CJSON_NESTING_LIMIT.
      - Ordinary allocation failure is established as the cause of the observed 1000/1001 boundary.
