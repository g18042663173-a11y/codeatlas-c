  kr-v2-lwip-condition-second-init-fails:
    expected_points:
      - id: l4-condition
        text: Keep lwipopts.h and the call order unchanged, but make test_init return ERR_OK on its first invocation and ERR_IF on its second invocation.
        kind: condition
        evidence: [l4-current-init, l4-harness-order]
      - id: l4-second-return
        text: add_first remains ok, while add_second prints failed because netif_add returns NULL when the second init call returns ERR_IF.
        kind: fact
        evidence: [l4-init-before-insert, l4-harness-order]
      - id: l4-after-second
        text: after_second prints list=first default=first.
        kind: fact
        evidence: [l4-current-output, l4-init-before-insert, l4-list-insert]
      - id: l4-order-reason
        text: netif_add calls init before it prepends the candidate to netif_list, so the failed second candidate never replaces first as the list head.
        kind: fact
        evidence: [l4-init-before-insert, l4-list-insert]
      - id: l4-first-preserved
        text: The already-linked first interface and the explicitly selected netif_default remain unchanged because the second failure returns before global list insertion and the harness does not call netif_set_default again; this does not imply every field written on the rejected second struct is rolled back.
