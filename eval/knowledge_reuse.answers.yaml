tasks:
  kr-v2-cjson-condition-limit-1001:
    expected_points:
      - id: c1-condition
        text: The comparison keeps fixed_depths={999,1000,1001}, require_null_terminated=1, the source revision, and the harness unchanged; the only treatment is defining CJSON_NESTING_LIMIT=1001 for the cJSON.c translation unit.
        kind: condition
        evidence: [c1-harness-cases, c1-harness-call, c1-revision-check, c1-build-default, c1-default-limit]
      - id: c1-input-lengths
        text: input_len remains 1999, 2001, and 2003 for depths 999, 1000, and 1001 respectively because the macro does not alter nested_array's 2*depth+1-byte JSON text.
        kind: fact
        evidence: [c1-generator, c1-current-output]
      - id: c1-lower-cases
        text: The depth=999 and depth=1000 lines remain result=ok with parse_end equal to input_len (1999 and 2001 respectively).
        kind: fact
        evidence: [c1-current-output, c1-array-guard]
      - id: c1-depth-1001
        text: The depth=1001 line changes from result=NULL parse_end=1000 input_len=2003 to result=ok parse_end=2003 input_len=2003.
        kind: fact
        evidence: [c1-current-output, c1-array-guard, c1-generator]
      - id: c1-boundary
        text: The boundary moves by one level because parse_array and parse_object both test current depth >= limit before incrementing it; this array-only harness exercises parse_array, where limit 1001 admits entries at current depths 0 through 1000 and the old limit 1000 rejected the entry at current depth 1000.
        kind: fact
        evidence: [c1-array-guard, c1-object-guard, c1-default-limit]
    forbidden_claims:
      - With CJSON_NESTING_LIMIT=1001, depth 1001 still returns NULL at parse_end 1000.
      - Changing only CJSON_NESTING_LIMIT changes the three generated input lengths.
      - Either depth 999 or depth 1000 becomes a failure in the 1001-limit build.
      - The boundary shift is caused by changing the harness inputs or require_null_terminated.
