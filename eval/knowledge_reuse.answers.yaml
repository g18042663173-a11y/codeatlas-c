  kr-v2-cjson-verify-limit-ab:
    expected_points:
      - id: c3-controlled-ab
        text: A and B use the same checked source revision, compiler flags, include path, and reproduce.c; B's only semantic difference is CJSON_NESTING_LIMIT=1001 applied when cJSON.c is compiled.
        kind: condition
        evidence: [c3-revision-check, c3-run-command, c3-fixed-cases, c3-default-limit]
      - id: c3-build-a
        text: |-
          From the repository root, an immediately executable A setup is:
            build_dir="$(mktemp -d "${TMPDIR:-/tmp}/codeatlas-cjson-ab.XXXXXX")"
            cc -std=c99 -Wall -Wextra -Werror -I corpus/cJSON -c examples/reproductions/cjson-nesting/reproduce.c -o "$build_dir/harness.o"
            cc -std=c99 -Wall -Wextra -Werror -I corpus/cJSON -c corpus/cJSON/cJSON.c -o "$build_dir/cjson-a.o"
            cc "$build_dir/cjson-a.o" "$build_dir/harness.o" -lm -o "$build_dir/a"
            "$build_dir/a"
        kind: action
        evidence: [c3-run-command]
      - id: c3-build-b
        text: |-
          Reuse the same harness.o and build/run B with the define scoped to cJSON.c:
            cc -std=c99 -Wall -Wextra -Werror -I corpus/cJSON -DCJSON_NESTING_LIMIT=1001 -c corpus/cJSON/cJSON.c -o "$build_dir/cjson-b.o"
            cc "$build_dir/cjson-b.o" "$build_dir/harness.o" -lm -o "$build_dir/b"
            "$build_dir/b"
          Compare stdout directly; run.sh's diff still names the old A result and is not the B oracle.
        kind: action
        evidence: [c3-run-command, c3-default-limit]
      - id: c3-output-a
        text: "A must print the current three lines: 999 ok/end 1999/len 1999; 1000 ok/end 2001/len 2001; 1001 NULL/end 1000/len 2003."
        kind: fact
        evidence: [c3-output]
      - id: c3-output-b
        text: B should leave the 999 and 1000 lines unchanged and print depth=1001 result=ok parse_end=2003 input_len=2003.
        kind: fact
        evidence: [c3-output, c3-guard, c3-generator]
      - id: c3-falsifier
