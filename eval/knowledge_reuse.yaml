tasks:
  - id: kr-v2-cjson-condition-limit-1001
    case_id: cjson-nesting
    question: "保持 reproduce.c 的 fixed_depths={999,1000,1001} 和 require_null_terminated=1 不变，仅在编译 cJSON.c 时定义 CJSON_NESTING_LIMIT=1001。根据 parse_array/parse_object 在 depth 自增前执行的 >= 检查，预测三行 result、parse_end 和 input_len 中哪些字段会相对当前 result.txt 变化，并解释边界为什么移动一层。"
  - id: kr-v2-cjson-exclude-error-causes
    case_id: cjson-nesting
    question: "现有观测中 depth=1000 成功，depth=1001 则 result=NULL 且 parse_end=1000。结合 nested_array 的构造、require_null_terminated=1、深度守卫与失败位置记录代码，哪些“末尾非 NUL”、“括号本身不配对”、“命中嵌套上限”或“普通分配失败”解释可由当前证据排除、支持或仍须额外实验？逐项给出证据边界。"
  - id: kr-v2-cjson-verify-limit-ab
    case_id: cjson-nesting
    question: "设计一个可立即执行的最小 A/B 验证：A 保持 run.sh 的默认编译，B 只为 cJSON.c 增加 -DCJSON_NESTING_LIMIT=1001，两者均运行同一 reproduce.c。写出具体编译/运行改动、预期区分两个假设的关键输出，以及哪种观测会否定“失败由固定嵌套上限触发”。"
  - id: kr-v2-lwip-condition-second-init-fails
    case_id: lwip-netif
    question: "保持当前 lwipopts.h 与调用顺序不变，只把 test_init 改成第一次返回 ERR_OK、第二次返回 ERR_IF。根据 netif_add 调用 init 和把 netif 插入 netif_list 的先后顺序，预测 add_second 以及 after_second 的 list/default 输出，并说明为什么第一个接口的状态不应被第二次初始化失败改写。"
  - id: kr-v2-lwip-exclude-default-alias
    case_id: lwip-netif
    question: "当前 result.txt 显示首次 netif_add 后 list=first 但 default=none，显式 netif_set_default(&first) 后 default=first，再添加 second 后 list=second 但 default=first。结合 which 的指针身份判定、链表头插代码和 netif_set_default，哪些“netif_add 会自动设默认”、“default 始终是链表头”、“第二次 add 未真正入链”解释可被逐一排除？说明每个结论依赖的观测。"
  - id: kr-v2-lwip-verify-clear-default
    case_id: lwip-netif
    question: "为验证 netif_default 与 netif_list 是可独立改变的状态，在现有 harness 的 after_second 打印后插入 netif_set_default(NULL)，并立即用 which 再打印 list/default，其他操作不变。写出最小代码改动、预期新输出，以及若 list 也随之变为 none 将否定源码机制中的什么判断。"
