  ho-cjson-error-find-pointer-ownership:
    expected_points:
      - id: base-result
        text: "object==target 时返回新分配的空字符串；递归命中后每层为数组下标或编码对象键分配更长字符串。"
        evidence: "cJSON_Utils.c:198-224,240-248"
      - id: ownership-transfer
        text: "每层拼出 full_pointer 后释放下层 target_pointer 并返回新字符串；最终调用者应使用 cJSON_free 释放。"
        evidence: "cJSON_Utils.c:224-248"
      - id: visible-oom-gap
        text: "full_pointer 的 cJSON_malloc 结果在数组分支直接传给 sprintf、对象分支直接写 full_pointer[0]，没有先判 NULL；因此不能声称该处 OOM 被完整防护。"
        evidence: "cJSON_Utils.c:223-245"
      - id: not-found
        text: "未命中 target 时返回 NULL；到叶节点若下层临时指针存在但父非数组/对象，会先释放它。"
        evidence: "cJSON_Utils.c:251-258"
    forbidden_claims:
      - "不得声称所有分配失败都会安全返回 NULL。"
      - "不得声称返回字符串是静态内存或由 object 管理。"
    evidence_payload:
      source:
        - {path: cJSON_Utils.c, lines: "198-259", permalink: "https://github.com/DaveGamble/cJSON/blob/fb16e5cf358798aabb049655975cde8427101056/cJSON_Utils.c#L198-L259"}
      experiment:
        kind: allocator_failure_injection
        executed: false
        setup: "让递归命中后用于 full_pointer 的 cJSON_malloc 返回 NULL。"
        expected: "源码会在 NULL 上 sprintf/写入，不能期待优雅的 NULL 返回；该用例应由安全测试捕获。"

  ho-cjson-state-hooks-realloc:
    expected_points:
      - id: reset
        text: "cJSON_InitHooks(NULL) 把 allocate/deallocate/reallocate 全部恢复为 malloc/free/realloc。"
        evidence: "cJSON.c:209-218"
      - id: partial-hooks
        text: "非 NULL hooks 先把 allocate/deallocate 设为标准函数，再分别采用非空 malloc_fn/free_fn；没有提供的一侧仍是标准函数。"
        evidence: "cJSON.c:220-230"
      - id: realloc-gate
        text: "随后 reallocate 先清为 NULL，只有最终 allocate==malloc 且 deallocate==free 时才恢复 realloc；任一侧自定义都会禁用。"
