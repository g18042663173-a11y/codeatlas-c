        expected: "reallocate 状态依次为 realloc、NULL、NULL。"

  ho-cjson-state-list-tail-invariant:
    expected_points:
      - id: empty
        text: "空数组首次插入令 array->child=item、item->prev=item、item->next=NULL；首节点 prev 同时就是尾指针。"
        evidence: "cJSON.c:2036-2045"
      - id: append
        text: "非空数组通过 child->prev 直接取得旧尾，suffix_object 设置 old_tail->next 与 item->prev，再令 child->prev=item。"
        evidence: "cJSON.c:1999-2003,2047-2054"
      - id: invariants
        text: "追加后 array->child 仍指首节点，child->prev 指新尾，新尾 next 为 NULL；首节点的 prev 不是普通前驱。"
        evidence: "cJSON.c:2040-2054"
    forbidden_claims:
      - "不得把该结构描述为以 NULL 作为首节点 prev 的普通双向链表。"
      - "不得声称追加需要从 child 线性扫描到尾。"
    evidence_payload:
      source:
        - {path: cJSON.c, lines: "1999-2058", permalink: "https://github.com/DaveGamble/cJSON/blob/fb16e5cf358798aabb049655975cde8427101056/cJSON.c#L2027-L2058"}
      experiment:
        kind: invariant_probe
        executed: false
        setup: "向空数组连续追加 a、b、c。"
        expected: "child=a，a.prev=c，a.next=b，b.prev=a，b.next=c，c.prev=b，c.next=NULL。"

