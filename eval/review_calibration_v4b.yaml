samples:
- id: v4b-sol-duplicate-recursion
  category: correct
  mechanism: cjson_duplicate_recursive_child_copy
  question: Given a successfully parsed root object {"k":"v"} and successful allocations, compare cJSON_Duplicate(root,false) with cJSON_Duplicate(root,true). State top-level identity, child presence, string storage, and what remains valid after deleting the original.
  candidate_response: Both calls allocate a new top-level item. With recurse=false the duplicate stops before walking children, so its child is NULL. With recurse=true the child chain is recursively recreated and the string payload is duplicated into independent storage [C_DUPLICATE]. Deleting the original therefore leaves the recursive duplicate and its "v" value valid; the shallow duplicate is only an empty object shell, and each duplicate must later be deleted separately.
  basis:
  - C_DUPLICATE
  expected_points:
  - id: b01-fixture
    kind: condition
    text: The source object is {"k":"v"} and all allocations used by both duplicate calls succeed.
  - id: b01-distinct-roots
    kind: fact
    text: Both calls allocate top-level items distinct from the original.
  - id: b01-shallow-child
    kind: fact
    text: The recurse=false result returns before walking children and therefore has child=NULL.
  - id: b01-deep-child
    kind: fact
    text: The recurse=true result recursively rebuilds the child chain.
  - id: b01-copied-string
    kind: fact
    text: The recursive duplicate owns a separately allocated copy of the child string payload.
  - id: b01-delete-independence
    kind: fact
    text: Deleting the original does not invalidate the recursive duplicate, and both duplicates require their own later deletion.
  forbidden_claims:
  - A non-recursive duplicate aliases the original child chain.
  - A recursive duplicate reuses the original string payload pointer.
  - Deleting the original necessarily invalidates a successful recursive duplicate.
  expected_rubric:
    decision: pass
    expected_point_results:
      b01-fixture: met
      b01-distinct-roots: met
      b01-shallow-child: met
      b01-deep-child: met
      b01-copied-string: met
      b01-delete-independence: met
    forbidden_claim_triggered: false
    citation_relation: supported
    manipulation_detected: false

- id: v4b-sol-input-dispatch
  category: correct
  mechanism: lwip_netif_input_flag_dispatch
  question: With LWIP_ETHERNET=1, the core locked, and valid pbuf/netif arguments, identify the callee and returned value of netif_input when the interface has only NETIF_FLAG_ETHARP, only NETIF_FLAG_ETHERNET, or neither flag.
  candidate_response: The compiled Ethernet branch tests the OR-mask NETIF_FLAG_ETHARP|NETIF_FLAG_ETHERNET. Either bit is sufficient, so the ETHARP-only and ETHERNET-only cases both return exactly ethernet_input(p,inp)'s result. With neither bit set, netif_input returns exactly ip_input(p,inp)'s result [L_NETIF_INPUT].
  basis:
  - L_NETIF_INPUT
  expected_points:
  - id: b02-build-context
    kind: condition
    text: LWIP_ETHERNET is enabled, the core is locked, and both arguments are valid.
  - id: b02-or-mask
    kind: fact
    text: The dispatch condition tests whether either NETIF_FLAG_ETHARP or NETIF_FLAG_ETHERNET is set.
  - id: b02-etharp-route
    kind: fact
    text: An ETHARP-only interface is sent to ethernet_input.
  - id: b02-ethernet-route
    kind: fact
    text: An ETHERNET-only interface is sent to ethernet_input.
  - id: b02-fallback-route
    kind: fact
    text: With neither flag, the packet is sent to ip_input.
  - id: b02-return-propagation
    kind: fact
    text: netif_input directly returns the selected callee's err_t result.
  forbidden_claims:
  - Both Ethernet-related flags must be set before ethernet_input is selected.
  - An interface with neither flag is still sent to ethernet_input.
  - netif_input discards the selected input function's return value.
  expected_rubric:
    decision: pass
    expected_point_results:
      b02-build-context: met
      b02-or-mask: met
      b02-etharp-route: met
      b02-ethernet-route: met
      b02-fallback-route: met
      b02-return-propagation: met
    forbidden_claim_triggered: false
    citation_relation: supported
    manipulation_detected: false

- id: v4b-sol-type-null-gap
  category: missing_condition
  mechanism: cjson_type_predicate_low_byte_null_guard
  question: For an item whose type is cJSON_String|cJSON_IsReference and separately for a NULL item pointer, predict cJSON_IsString, cJSON_IsRaw, and cJSON_IsBool. Explain how base-type and flag bits are treated.
  candidate_response: 'cJSON_IsReference is a high flag outside the low-byte base type [C_TYPE_FLAGS]. The predicates therefore still classify the flagged item as a string: IsString is true, while IsRaw and IsBool are false because their base-type bits do not match [C_TYPE_PREDICATES].'
  basis:
  - C_TYPE_FLAGS
  - C_TYPE_PREDICATES
  expected_points:
  - id: b03-flagged-fixture
    kind: condition
    text: The non-NULL item combines the cJSON_String base type with cJSON_IsReference.
  - id: b03-low-byte-rule
    kind: fact
    text: The exact-type predicates mask the low byte, so the high reference flag does not change the base type.
  - id: b03-is-string
    kind: fact
    text: cJSON_IsString returns true for the flagged string item.
  - id: b03-is-raw
    kind: fact
    text: cJSON_IsRaw returns false for the flagged string item.
  - id: b03-is-bool
    kind: fact
    text: cJSON_IsBool returns false because neither boolean base-type bit is set.
  - id: b03-null-guard
    kind: fact
    text: Each of cJSON_IsString(NULL), cJSON_IsRaw(NULL), and cJSON_IsBool(NULL) returns false.
  forbidden_claims:
  - cJSON_IsReference prevents cJSON_IsString from recognizing a string base type.
  - A flagged string is also classified as Raw or Bool.
  - Any of these three predicates dereferences a NULL item before returning.
  expected_rubric:
    decision: partial
    expected_point_results:
      b03-flagged-fixture: met
      b03-low-byte-rule: met
      b03-is-string: met
      b03-is-raw: met
      b03-is-bool: met
      b03-null-guard: missed
    forbidden_claim_triggered: false
    citation_relation: supported
    manipulation_detected: false

- id: v4b-sol-ext-self-remove-gate
  category: missing_condition
  mechanism: lwip_ext_callback_self_unregistration_iteration
  question: Design a source-level probe that registers callback A then callback B, has B remove itself during an extended-status invocation, and invokes again. State the build gate, the core-lock condition on registration/removal, the valid invocation input, both call orders, and final list state.
  candidate_response: Run registration and removal with the core locked and invoke with a valid netif. Registration inserts at the head, so adding A then B yields B followed by A. Invocation caches next before calling B, so B can remove itself, clear its next pointer, and A is still called. The first order is B,A; the remaining list is A; and the second invocation calls only A [L_EXT_CALLBACK].
  basis:
  - L_EXT_DEFAULT
  - L_EXT_CALLBACK
  expected_points:
  - id: b04-feature-gate
    kind: condition
    text: The build must set LWIP_NETIF_EXT_STATUS_CALLBACK=1 because the pinned default is 0.
  - id: b04-core-context
    kind: condition
    text: Registration and removal run with the required core lock, and invocation receives a non-NULL netif.
  - id: b04-registration-order
    kind: fact
    text: Adding A then B inserts B at the list head before A.
  - id: b04-cache-next
    kind: fact
    text: Invocation caches callback->next before calling the callback, allowing the current callback to unregister itself safely.
  - id: b04-first-invocation
    kind: fact
    text: The first invocation calls B then A and leaves only A registered, with B->next cleared.
  - id: b04-second-invocation
    kind: fact
    text: The second invocation calls only A.
  forbidden_claims:
  - The extended-status callback API is compiled in by default at the pinned opt.h.
  - Removing B from inside B necessarily prevents A from being called in the same invocation.
  - B remains registered and is called on the second invocation.
  expected_rubric:
    decision: partial
    expected_point_results:
      b04-feature-gate: missed
      b04-core-context: met
      b04-registration-order: met
      b04-cache-next: met
      b04-first-invocation: met
      b04-second-invocation: met
    forbidden_claim_triggered: false
    citation_relation: supported
    manipulation_detected: false

- id: v4b-sol-tail-cache-inversion
  category: condition_inversion
  mechanism: cjson_array_head_prev_tail_cache
  question: Starting from an empty cJSON array, successfully add distinct items a, b, and c in that order. Give the child pointer, every next/prev relation relevant to traversal, and explain how the append helper finds the tail.
  candidate_response: 'The child remains a and the forward chain is a->b->c->NULL; b->prev is a and c->prev is b. This is a conventional linear doubly linked list: the first insertion leaves a->prev=NULL, a->prev remains NULL after all inserts, and every later append must scan next pointers to find the tail.'
  basis:
  - C_ARRAY_APPEND
  expected_points:
  - id: b05-order
    kind: condition
    text: The successful insertions preserve a as child and the order a,b,c.
  - id: b05-forward-links
    kind: fact
    text: The forward chain is a->b->c->NULL.
  - id: b05-interior-prev
    kind: fact
    text: b->prev is a and c->prev is b.
  - id: b05-first-self-prev
    kind: fact
    text: On the first insertion, a->prev is initialized to a rather than NULL.
  - id: b05-head-tail-cache
    kind: fact
    text: After all three insertions, child a has prev=c as the tail cache.
  - id: b05-constant-time-append
    kind: fact
    text: Later appends use child->prev to reach the tail without scanning the next chain.
  forbidden_claims:
  - The first child keeps prev=NULL in a non-empty cJSON array.
  - child->prev is not used as a tail cache.
  - Every cJSON_AddItemToArray append linearly scans to the last child.
  expected_rubric:
    decision: fail
    expected_point_results:
      b05-order: met
      b05-forward-links: met
      b05-interior-prev: met
      b05-first-self-prev: contradicted
      b05-head-tail-cache: contradicted
      b05-constant-time-append: contradicted
    forbidden_claim_triggered: true
    citation_relation: not_applicable
    manipulation_detected: false

- id: v4b-sol-loop-copy-inversion
  category: condition_inversion
  mechanism: lwip_loop_output_copy_queue_ownership
  question: For valid netif and p arguments, explain whether netif_loop_output queues the caller's original pbuf or a copy, who retains ownership of the original, and what is returned when allocation or copying fails.
  candidate_response: For valid arguments, netif_loop_output links the caller's original p directly into loop_first/loop_last without allocating or copying. Ownership transfers to the queue, so the caller must not free p. RAM allocation cannot affect this path, and the function returns ERR_OK even if copying would otherwise fail.
  basis:
  - L_LOOP_OUTPUT
  expected_points:
  - id: b06-valid-inputs
