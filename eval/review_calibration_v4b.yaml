    excerpt: " * The pbuf is copied and added to an internal queue which is fed to
      \n * netif->input by netif_poll().\n * In multithreaded mode, the call to netif_poll()
      is queued to be done on the\n * TCP/IP thread.\n * In callback mode, the user
      has the responsibility to call netif_poll() in \n * the main loop of their application.\n
      *\n * @param netif the lwip network interface structure\n * @param p the (IP)
      packet to 'send'\n * @return ERR_OK if the packet has been sent\n *         ERR_MEM
      if the pbuf used to copy the packet couldn't be allocated\n */\nerr_t\nnetif_loop_output(struct
      netif *netif, struct pbuf *p)\n{\n  struct pbuf *r;\n  err_t err;\n  struct
      pbuf *last;\n#if LWIP_LOOPBACK_MAX_PBUFS\n  u16_t clen = 0;\n#endif /* LWIP_LOOPBACK_MAX_PBUFS
      */\n  /* If we have a loopif, SNMP counters are adjusted for it,\n   * if not
      they are adjusted for 'netif'. */\n#if MIB2_STATS\n#if LWIP_HAVE_LOOPIF\n  struct
      netif *stats_if = &loop_netif;\n#else /* LWIP_HAVE_LOOPIF */\n  struct netif
      *stats_if = netif;\n#endif /* LWIP_HAVE_LOOPIF */\n#endif /* MIB2_STATS */\n#if
      LWIP_NETIF_LOOPBACK_MULTITHREADING\n  u8_t schedule_poll = 0;\n#endif /* LWIP_NETIF_LOOPBACK_MULTITHREADING
      */\n  SYS_ARCH_DECL_PROTECT(lev);\n\n  LWIP_ASSERT(\"netif_loop_output: invalid
      netif\", netif != NULL);\n  LWIP_ASSERT(\"netif_loop_output: invalid pbuf\",
      p != NULL);\n\n  /* Allocate a new pbuf */\n  r = pbuf_alloc(PBUF_LINK, p->tot_len,
      PBUF_RAM);\n  if (r == NULL) {\n    LINK_STATS_INC(link.memerr);\n    LINK_STATS_INC(link.drop);\n
      \   MIB2_STATS_NETIF_INC(stats_if, ifoutdiscards);\n    return ERR_MEM;\n  }\n#if
      LWIP_LOOPBACK_MAX_PBUFS\n  clen = pbuf_clen(r);\n  /* check for overflow or
      too many pbuf on queue */\n  if (((netif->loop_cnt_current + clen) < netif->loop_cnt_current)
      ||\n      ((netif->loop_cnt_current + clen) > LWIP_MIN(LWIP_LOOPBACK_MAX_PBUFS,
      0xFFFF))) {\n    pbuf_free(r);\n    LINK_STATS_INC(link.memerr);\n    LINK_STATS_INC(link.drop);\n
      \   MIB2_STATS_NETIF_INC(stats_if, ifoutdiscards);\n    return ERR_MEM;\n  }\n
      \ netif->loop_cnt_current = (u16_t)(netif->loop_cnt_current + clen);\n#endif
      /* LWIP_LOOPBACK_MAX_PBUFS */\n\n  /* Copy the whole pbuf queue p into the single
      pbuf r */\n  if ((err = pbuf_copy(r, p)) != ERR_OK) {\n    pbuf_free(r);\n    LINK_STATS_INC(link.memerr);\n
      \   LINK_STATS_INC(link.drop);\n    MIB2_STATS_NETIF_INC(stats_if, ifoutdiscards);\n
      \   return err;\n  }\n\n  /* Put the packet on a linked list which gets emptied
      through calling\n     netif_poll(). */\n\n  /* let last point to the last pbuf
      in chain r */\n  for (last = r; last->next != NULL; last = last->next) {\n    /*
      nothing to do here, just get to the last pbuf */\n  }\n\n  SYS_ARCH_PROTECT(lev);\n
      \ if (netif->loop_first != NULL) {\n    LWIP_ASSERT(\"if first != NULL, last
      must also be != NULL\", netif->loop_last != NULL);\n    netif->loop_last->next
      = r;\n    netif->loop_last = last;\n#if LWIP_NETIF_LOOPBACK_MULTITHREADING\n
      \   if (netif->reschedule_poll) {\n      schedule_poll = 1;\n      netif->reschedule_poll
      = 0;\n    }\n#endif /* LWIP_NETIF_LOOPBACK_MULTITHREADING */\n  } else {\n    netif->loop_first
      = r;\n    netif->loop_last = last;\n#if LWIP_NETIF_LOOPBACK_MULTITHREADING\n
      \   /* No existing packets queued, schedule poll */\n    schedule_poll = 1;\n#endif
      /* LWIP_NETIF_LOOPBACK_MULTITHREADING */\n  }\n  SYS_ARCH_UNPROTECT(lev);\n\n
      \ LINK_STATS_INC(link.xmit);\n  MIB2_STATS_NETIF_ADD(stats_if, ifoutoctets,
      p->tot_len);\n  MIB2_STATS_NETIF_INC(stats_if, ifoutucastpkts);\n\n#if LWIP_NETIF_LOOPBACK_MULTITHREADING\n
      \ /* For multithreading environment, schedule a call to netif_poll */\n  if
      (schedule_poll) {\n    if (tcpip_try_callback((tcpip_callback_fn)netif_poll,
      netif) != ERR_OK) {\n      SYS_ARCH_PROTECT(lev);\n      netif->reschedule_poll
      = 1;\n      SYS_ARCH_UNPROTECT(lev);\n    }\n  }\n#endif /* LWIP_NETIF_LOOPBACK_MULTITHREADING
      */\n\n  return ERR_OK;\n}"
    excerpt_sha256: 25093febff2979000458e8e4526eac1225b4cb2ac96872fa10c938d64731b4f1
