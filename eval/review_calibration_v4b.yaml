  C_MINIFY_IMPL:
    path: corpus/cJSON/cJSON.c
    sha256: 607e756460fa0de37d20a7a9181f2de29c97bfb7ce5a0e6c2f548243836cd852
    line_start: 2924
    line_end: 2970
    excerpt: |-
      CJSON_PUBLIC(void) cJSON_Minify(char *json)
      {
          char *into = json;

          if (json == NULL)
          {
              return;
          }

          while (json[0] != '\0')
          {
              switch (json[0])
              {
                  case ' ':
                  case '\t':
                  case '\r':
                  case '\n':
                      json++;
                      break;

                  case '/':
                      if (json[1] == '/')
                      {
                          skip_oneline_comment(&json);
                      }
                      else if (json[1] == '*')
                      {
                          skip_multiline_comment(&json);
                      } else {
                          json++;
                      }
                      break;

                  case '\"':
                      minify_string(&json, (char**)&into);
                      break;

                  default:
                      into[0] = json[0];
                      json++;
                      into++;
              }
          }

          /* and null-terminate. */
          *into = '\0';
      }
    excerpt_sha256: f8cdcd9287541fe26223c4662d9f06522a861eb5207d8ab90d4c396c54fdbdcd
