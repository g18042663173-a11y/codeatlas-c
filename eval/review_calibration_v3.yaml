  - id: v3-cal-03
    category: missing_condition
    labels_from: cal-03
    basis_from: cal-03
    candidate_response: |-
      From the same checked revision, use `build_dir="$(mktemp -d "${TMPDIR:-/tmp}/codeatlas-cjson-ab.XXXXXX")"`, then compile the unchanged harness with `cc -std=c99 -Wall -Wextra -Werror -I corpus/cJSON -c examples/reproductions/cjson-nesting/reproduce.c -o "$build_dir/harness.o"`. Build A with `cc -std=c99 -Wall -Wextra -Werror -I corpus/cJSON -c corpus/cJSON/cJSON.c -o "$build_dir/cjson-a.o"`, link `cc "$build_dir/cjson-a.o" "$build_dir/harness.o" -lm -o "$build_dir/a"`, and run A. Build B with the identical cJSON.c command plus `-DCJSON_NESTING_LIMIT=1001`, link the same harness.o to `$build_dir/b`, and run B [E1]. A must reproduce the frozen 999-ok/1999, 1000-ok/2001 and 1001-NULL/1000 lines. B must leave the first two unchanged and make 1001 succeed with parse_end=2003 and input_len=2003. Compare stdout directly; the old result.txt is not B's oracle.

  - id: v3-cal-04
    category: missing_condition
    labels_from: cal-04
    basis_from: cal-04
    citation_relation: supported
    candidate_response: |-
      If the second init callback returns ERR_IF, add_second is failed. Because init runs before insertion [E1], second never becomes the list head; the already linked first interface remains list=first and default=first [E2].

  - id: v3-cal-05
    category: condition_inversion
    labels_from: cal-05
    basis_from: cal-05
    candidate_response: |-
      With CJSON_NESTING_LIMIT=1001, parse_array increments depth before performing the >= test. The 1001 input is therefore still rejected at parse_end 1000, so none of the three output lines changes.

  - id: v3-cal-06
    category: condition_inversion
    labels_from: cal-06
    basis_from: cal-06
    candidate_response: |-
      Make the first init succeed and the second return ERR_IF. netif_add inserts second and selects it as default before it calls init, so the failed add still leaves list=second and default=second and removes first from the observable state.

  - id: v3-cal-07
    category: true_citation_false_conclusion
    labels_from: cal-07
    basis_from: cal-07
    candidate_response: |-
      The terminal-NUL check exists [E1], so the depth=1001 failure proves the generated input was not NUL terminated. The generator and nesting guard can be ignored, and the failure offset is a universal missing-NUL code.

