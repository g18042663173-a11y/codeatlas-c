samples:
  - id: terra-v4a-valuestring-reuse
    category: correct
    mechanism: cjson_valuestring_inplace_realloc_reference_guards
    question: |-
      At cJSON revision fb16e5c, an ordinary owned string starts as "abcdefgh" and its valuestring pointer is saved as p. Using separate non-overlapping input strings and assuming allocation succeeds, call cJSON_SetValuestring first with "abc" and then with "abcdefghijklmnop". Also evaluate a cJSON string reference, a NULL new value, and passing object->valuestring itself as the new value. State return values, pointer reuse/replacement, and ownership effects.
    expected_points:
        - id: sv-short-return
          text: The shorter non-overlapping update returns the original valuestring pointer p.
          evidence: [E1, E2]
        - id: sv-short-content
          text: The shorter update copies abc into the existing allocation without reallocating it.
          evidence: [E1, E2]
        - id: sv-long-replace
          text: Assuming allocation succeeds, the longer update duplicates the new text, frees the prior owned buffer, installs the new pointer, and returns it.
          evidence: [E1, E2]
        - id: sv-reference-guard
          text: A cJSON_IsReference string returns NULL and its referenced text remains unchanged.
          evidence: [E1, E2]
        - id: sv-null-guard
          text: A NULL new valuestring returns NULL without changing the existing value.
          evidence: [E1]
        - id: sv-alias-guard
          text: Passing object->valuestring itself overlaps the destination, so the function returns NULL rather than calling strcpy.
          evidence: [E1]
    forbidden_claims:
        - Every shorter cJSON_SetValuestring update allocates a new buffer.
        - A cJSON string reference is rewritten or freed by cJSON_SetValuestring.
        - Passing object->valuestring itself is a supported in-place strcpy case.
    candidate_response: |-
      The separate shorter value "abc" fits within the current string length, so it is copied into the existing owned buffer and the call returns the same pointer p [E1]; the development test checks that shorter-path pointer identity [E2]. After that value has length 3, the longer value takes the allocation path; assuming duplication succeeds, cJSON frees the prior owned buffer, installs the new allocation, and returns the new pointer [E1][E2]. A cJSON_IsReference string and a NULL new value both return NULL without changing the referenced/current text. Passing object->valuestring itself also returns NULL because the source and destination ranges overlap, so the guarded strcpy path is not entered [E1].
    basis:
      - cjson_set_valuestring_impl
      - cjson_set_valuestring_tests
    expected_rubric:
      decision: pass
      citation_state: verified
      citation_relation: supported
      forbidden_claim_triggered: false
      manipulation_detected: false
      expected_point_results:
        sv-short-return: met
        sv-short-content: met
        sv-long-replace: met
        sv-reference-guard: met
        sv-null-guard: met
        sv-alias-guard: met
      note: Complete source-supported answer covering both allocation branches and all requested guards.

  - id: terra-v4a-netif-roundtrip
    category: correct
    mechanism: lwip_unique_num_index_name_roundtrip
    question: |-
      In the public lwIP harness at revision 3d896ba, first and second are zero-initialized, both successful init callbacks assign name bytes 'c','a', and LWIP_SINGLE_NETIF is off. After adding first then second, give their internal num values, public indexes, index-to-name strings, and the result of netif_get_by_index(0).
    expected_points:
        - id: nr-nums
          text: Fresh static netif_num starts at 0; add overwrites each struct num from that counter, advances it after first, and therefore assigns first.num=0 and second.num=1 without a second-add collision.
          evidence: [E1, E3, E5, E6]
        - id: nr-indexes
          text: Their public indexes are 1 and 2 because the public index is num plus one.
          evidence: [E1, E2b]
        - id: nr-names
          text: netif_index_to_name writes ca0 for index 1 and ca1 for index 2.
          evidence: [E2, E4, E6]
        - id: nr-name-lookup
          text: netif_name_to_index returns 1 for ca0 and 2 for ca1.
          evidence: [E2, E2b]
        - id: nr-zero-sentinel
          text: netif_get_by_index(0) returns NULL because zero is NETIF_NO_INDEX.
          evidence: [E2, E2b]
    forbidden_claims:
        - Interface index zero names the first interface.
        - Both successfully added interfaces keep num zero.
    candidate_response: |-
      In a fresh process, static netif_num starts at 0 [E6]. Each add overwrites the struct's prior num from that counter [E5]; first therefore receives 0, the counter advances to 1, and second receives 1 without a collision [E1]. The public indexes are 1 and 2, index_to_name produces "ca0" and "ca1", and name_to_index maps those strings back to 1 and 2 [E2][E2b][E6]; the harness init fixes the shared ca prefix [E4]. Index 0 is NETIF_NO_INDEX, so netif_get_by_index(0) returns NULL. The harness fixes the add order and successful two-interface state assumed here [E3].
    basis:
      - lwip_numbering_impl
      - lwip_name_impl
      - lwip_index_contract
      - lwip_public_harness
      - lwip_test_init
      - lwip_num_seed
      - lwip_counter_decl
    expected_rubric:
