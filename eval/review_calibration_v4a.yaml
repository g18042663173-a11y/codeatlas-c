    path: corpus/lwip/src/core/netif.c
    revision: 3d896ba0a37ff3ce73270ca5e230707fe47f60e3
    sha256: a141be5b9c7ea5da55be1f33ff56342635009f31df1cf33d2b3a0159eeab9b78
